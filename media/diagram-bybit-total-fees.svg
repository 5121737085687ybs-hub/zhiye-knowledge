<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500"><rect width="1200" height="500" rx="28" fill="#eef1e9"/><text x="60" y="72" font-size="34" font-weight="700" fill="#293a31" font-family="sans-serif">下单前估算总成本</text><g font-family="sans-serif"><rect x="60" y="145" width="245" height="170" rx="20" fill="#fffdf8"/><text x="182" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#293a31">成交量</text><text x="182" y="250" text-anchor="middle" font-size="21" fill="#606b64">名目价值 × 费率</text><text x="182" y="285" text-anchor="middle" font-size="19" fill="#8b513a">依实际成交计算</text><rect x="345" y="145" width="245" height="170" rx="20" fill="#fffdf8"/><text x="467" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#293a31">持仓时间</text><text x="467" y="250" text-anchor="middle" font-size="21" fill="#606b64">可能有资金费用</text><text x="467" y="285" text-anchor="middle" font-size="19" fill="#8b513a">或借款利息</text><rect x="630" y="145" width="245" height="170" rx="20" fill="#fffdf8"/><text x="752" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#293a31">执行品质</text><text x="752" y="250" text-anchor="middle" font-size="21" fill="#606b64">点差、滑价</text><text x="752" y="285" text-anchor="middle" font-size="19" fill="#8b513a">可能随流动性变动</text><rect x="915" y="145" width="225" height="170" rx="20" fill="#fffdf8"/><text x="1027" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#293a31">转帐</text><text x="1027" y="250" text-anchor="middle" font-size="21" fill="#606b64">网路费 / 提领费</text><text x="1027" y="285" text-anchor="middle" font-size="19" fill="#8b513a">送出前再核对</text></g><path d="M307 230h33M592 230h33M877 230h33" stroke="#b87554" stroke-width="8" stroke-linecap="round"/><text x="60" y="400" font-size="22" fill="#59655e" font-family="sans-serif">挂单不必然是 Maker；是否立即成交与订单执行方式会影响分类。</text><text x="60" y="445" font-size="22" fill="#59655e" font-family="sans-serif">计算前先查看 My Fee Rates、合约规格与确认页显示。</text></svg>