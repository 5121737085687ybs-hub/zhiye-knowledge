<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="24" fill="#f4f7fb"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">先选委托逻辑，再检查执行条件</text><g font-family="Arial,sans-serif"><rect x="42" y="115" width="335" height="330" rx="20" fill="#fff" stroke="#d5dfed" stroke-width="3"/><rect x="42" y="115" width="335" height="58" rx="20" fill="#17243b"/><text x="209" y="153" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">基础类型</text><circle cx="92" cy="228" r="18" fill="#f7a928"/><text x="128" y="236" fill="#17243b" font-size="23" font-weight="700">市价</text><text x="92" y="270" fill="#52627a" font-size="17">优先争取尽快成交；价格可能变化</text><circle cx="92" cy="320" r="18" fill="#70d6b5"/><text x="128" y="328" fill="#17243b" font-size="23" font-weight="700">限价</text><text x="92" y="362" fill="#52627a" font-size="17">指定价格；可能等待、部分成交或不成交</text><circle cx="92" cy="408" r="18" fill="#91a9ff"/><text x="128" y="416" fill="#17243b" font-size="23" font-weight="700">条件单</text><rect x="432" y="115" width="335" height="330" rx="20" fill="#fff" stroke="#d5dfed" stroke-width="3"/><rect x="432" y="115" width="335" height="58" rx="20" fill="#344b78"/><text x="599" y="153" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">执行控制</text><text x="470" y="226" fill="#17243b" font-size="21" font-weight="700">触发价</text><text x="470" y="258" fill="#52627a" font-size="17">达到条件后才提交后续委托</text><text x="470" y="316" fill="#17243b" font-size="21" font-weight="700">委托有效期</text><text x="470" y="348" fill="#52627a" font-size="17">GTC 等待取消；IOC 立即撮合</text><text x="470" y="376" fill="#52627a" font-size="17">FOK 要求立即全部成交，否则取消</text><text x="470" y="420" fill="#17243b" font-size="18" font-weight="700">Post-Only：避免立即吃单</text><rect x="822" y="115" width="336" height="330" rx="20" fill="#fff" stroke="#d5dfed" stroke-width="3"/><rect x="822" y="115" width="336" height="58" rx="20" fill="#70d6b5"/><text x="990" y="153" text-anchor="middle" fill="#17243b" font-size="23" font-weight="700">送出前核对</text><g fill="#17243b" font-size="19"><text x="862" y="226">✓ 产品与交易对</text><text x="862" y="274">✓ 买卖方向与数量</text><text x="862" y="322">✓ 触发参考价格</text><text x="862" y="370">✓ 成交方式与滑点</text><text x="862" y="418">✓ 仓位范围与费用</text></g><path d="M380 280h42M770 280h42" stroke="#91a9ff" stroke-width="5" stroke-linecap="round"/><path d="m410 269 12 11-12 11m380-11 12 11-12 11" fill="none" stroke="#91a9ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="600" y="486" text-anchor="middle" fill="#52627a" font-family="Arial,sans-serif" font-size="17">不同产品的功能名称和可用范围可能不同，以账户当前界面为准</text></svg>