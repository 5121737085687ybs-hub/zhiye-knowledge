<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Bybit App官方来源四步核验</title><desc id="desc">从官方域名进入下载页，选择适用于设备的正式渠道，核对应用发布者与权限，完成安装后检查账户安全。</desc>
<rect width="1200" height="700" rx="28" fill="#f5f2e9"/><text x="70" y="72" fill="#597267" font-family="sans-serif" font-size="18" letter-spacing="3">知页 · 安全清单</text><text x="70" y="135" fill="#203d34" font-family="sans-serif" font-size="42" font-weight="700">下载应用前，逐步核实来源</text>
<g font-family="sans-serif">
<rect x="70" y="190" width="500" height="170" rx="24" fill="#e1ebe3"/><circle cx="120" cy="240" r="25" fill="#315348"/><text x="120" y="248" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">1</text><text x="165" y="248" fill="#203d34" font-size="26" font-weight="700">从官方入口开始</text><text x="110" y="300" fill="#496057" font-size="19">手动打开 Bybit 官网的下载页，不用陌生人发来的链接。</text>
<rect x="630" y="190" width="500" height="170" rx="24" fill="#eee7d7"/><circle cx="680" cy="240" r="25" fill="#6f6241"/><text x="680" y="248" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">2</text><text x="725" y="248" fill="#203d34" font-size="26" font-weight="700">选设备官方渠道</text><text x="670" y="300" fill="#746c58" font-size="19">优先使用 App Store 或 Google Play 中的官方应用。</text>
<rect x="70" y="400" width="500" height="170" rx="24" fill="#f1e2d9"/><circle cx="120" cy="450" r="25" fill="#885f4b"/><text x="120" y="458" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">3</text><text x="165" y="458" fill="#203d34" font-size="26" font-weight="700">核对发布者和权限</text><text x="110" y="510" fill="#826b5d" font-size="19">Android 安装包只从官网获取；检查发布者与请求权限。</text>
<rect x="630" y="400" width="500" height="170" rx="24" fill="#dce5df"/><circle cx="680" cy="450" r="25" fill="#536b48"/><text x="680" y="458" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">4</text><text x="725" y="458" fill="#203d34" font-size="26" font-weight="700">登录后保护账户</text><text x="670" y="510" fill="#496057" font-size="19">启用验证，查看设备会话；绝不向他人提供验证码。</text>
</g><path d="M570 275h60M570 485h60" stroke="#c7794b" stroke-width="5" stroke-linecap="round"/><text x="70" y="635" fill="#777a70" font-family="sans-serif" font-size="17">地区商店展示、功能和服务资格可能变化，以官方页面当前说明为准。</text></svg>