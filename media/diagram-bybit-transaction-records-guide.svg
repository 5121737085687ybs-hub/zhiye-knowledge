<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101827"/><text x="60" y="70" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">交易记录整理流程</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="80" y="170" width="245" height="170" rx="20" fill="#21334d"/><text x="202" y="230" fill="#f7a600" font-size="26">选数据类型</text><text x="202" y="278" fill="#fff" font-size="21">账户报表</text><text x="202" y="312" fill="#fff" font-size="21">交易日志 / 订单历史</text><rect x="385" y="170" width="245" height="170" rx="20" fill="#21334d"/><text x="507" y="230" fill="#f7a600" font-size="26">设时间范围</text><text x="507" y="278" fill="#fff" font-size="21">记录时区</text><text x="507" y="312" fill="#fff" font-size="21">必要时分段导出</text><rect x="690" y="170" width="245" height="170" rx="20" fill="#21334d"/><text x="812" y="230" fill="#f7a600" font-size="26">核对完整性</text><text x="812" y="278" fill="#fff" font-size="21">检查账户与产品</text><text x="812" y="312" fill="#fff" font-size="21">抽查记录衔接</text><rect x="995" y="170" width="150" height="170" rx="20" fill="#21334d"/><text x="1070" y="230" fill="#f7a600" font-size="26">安全归档</text><text x="1070" y="285" fill="#fff" font-size="20">限制访问</text></g><g stroke="#f7a600" stroke-width="5"><path d="M325 255h55"/><path d="M630 255h55"/><path d="M935 255h50"/></g><rect x="80" y="405" width="1065" height="110" rx="20" fill="#18263a"/><text x="115" y="470" fill="#dbe4f2" font-family="Arial,sans-serif" font-size="23">导出文件辅助整理记录，但未必覆盖全部产品或构成完整税务资料。</text></svg>