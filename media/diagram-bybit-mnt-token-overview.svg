<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101827"/><text x="60" y="70" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">MNT 的用途需要分开理解</text><rect x="70" y="145" width="470" height="320" rx="24" fill="#1c2e47" stroke="#f7a600" stroke-width="2"/><rect x="660" y="145" width="470" height="320" rx="24" fill="#1c2e47" stroke="#62b6ff" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="110" y="205" fill="#f7a600" font-size="29" font-weight="700">Mantle 生态</text><text x="110" y="270" fill="#fff" font-size="23">网络相关代币</text><text x="110" y="320" fill="#cbd5e1" font-size="20">链上用途按官方规则和合约核实</text><text x="110" y="365" fill="#cbd5e1" font-size="20">链上持有与平台账户余额并非一回事</text><text x="700" y="205" fill="#62b6ff" font-size="29" font-weight="700">Bybit 平台功能</text><text x="700" y="270" fill="#fff" font-size="23">部分手续费抵扣</text><text x="700" y="320" fill="#cbd5e1" font-size="20">VIP 资格计算可能有附加规则</text><text x="700" y="365" fill="#cbd5e1" font-size="20">以账户类型和当期条款为准</text></g><path d="M540 305h120" stroke="#e5edf8" stroke-width="4" stroke-dasharray="10 10"/><text x="600" y="535" fill="#ffcf74" font-family="Arial,sans-serif" text-anchor="middle" font-size="23">两种使用场景各有条件；MNT 市场价格风险始终存在</text></svg>