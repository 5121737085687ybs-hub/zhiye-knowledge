<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="24" fill="#101827"/><text x="60" y="78" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">交易前检查股票账户的四个环节</text><g font-family="Arial,sans-serif"><rect x="65" y="170" width="250" height="300" rx="22" fill="#1b2a3d"/><circle cx="190" cy="230" r="34" fill="#c5ff2f"/><text x="190" y="240" text-anchor="middle" fill="#101827" font-size="27" font-weight="700">1</text><text x="190" y="310" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">确认地区</text><text x="190" y="360" text-anchor="middle" fill="#aab6c6" font-size="19">本人账户页面</text><text x="190" y="390" text-anchor="middle" fill="#aab6c6" font-size="19">是否开放服务</text><rect x="355" y="170" width="250" height="300" rx="22" fill="#1b2a3d"/><circle cx="480" cy="230" r="34" fill="#c5ff2f"/><text x="480" y="240" text-anchor="middle" fill="#101827" font-size="27" font-weight="700">2</text><text x="480" y="310" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">看持仓结构</text><text x="480" y="360" text-anchor="middle" fill="#aab6c6" font-size="19">账户条款与</text><text x="480" y="390" text-anchor="middle" fill="#aab6c6" font-size="19">托管安排</text><rect x="645" y="170" width="250" height="300" rx="22" fill="#1b2a3d"/><circle cx="770" cy="230" r="34" fill="#c5ff2f"/><text x="770" y="240" text-anchor="middle" fill="#101827" font-size="27" font-weight="700">3</text><text x="770" y="310" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">核对资金</text><text x="770" y="360" text-anchor="middle" fill="#aab6c6" font-size="19">USDT划转、费用</text><text x="770" y="390" text-anchor="middle" fill="#aab6c6" font-size="19">订单和交易时段</text><rect x="935" y="170" width="200" height="300" rx="22" fill="#1b2a3d"/><circle cx="1035" cy="230" r="34" fill="#c5ff2f"/><text x="1035" y="240" text-anchor="middle" fill="#101827" font-size="27" font-weight="700">4</text><text x="1035" y="310" text-anchor="mi