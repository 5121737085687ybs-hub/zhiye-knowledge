<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Bybit AI子账户权限管理指南</title><desc id="desc">说明AI交易账户的资金边界、操作权限与人工确认。</desc>
<rect width="1200" height="630" rx="34" fill="#f5f2e9"/><circle cx="940" cy="315" r="255" fill="#e1ebe3"/><circle cx="940" cy="315" r="170" fill="#d4e0d6"/>
<text x="72" y="82" fill="#597267" font-family="sans-serif" font-size="20" letter-spacing="4">知页 · AI交易权限</text>
<text x="72" y="182" fill="#203d34" font-family="sans-serif" font-size="52" font-weight="700">给AI设好资金边界</text><text x="74" y="240" fill="#496057" font-family="sans-serif" font-size="28">Bybit AI子账户权限与风险检查</text>
<g transform="translate(800 142)" font-family="sans-serif"><rect x="8" y="35" width="284" height="245" rx="28" fill="#fffdf8" stroke="#315348" stroke-width="5"/><rect x="35" y="65" width="230" height="42" rx="12" fill="#e1ebe3"/><text x="150" y="93" text-anchor="middle" fill="#315348" font-size="18" font-weight="700">AI子账户</text><path d="M70 145h160M70 190h110" stroke="#789483" stroke-width="8" stroke-linecap="round"/><circle cx="222" cy="190" r="19" fill="#c7794b"/><path d="M126 242h50" stroke="#c7794b" stroke-width="6" stroke-linecap="round"/><path d="M150 12v24m-22-12h44" stroke="#315348" stroke-width="6" stroke-linecap="round"/></g>
<rect x="72" y="370" width="195" height="62" rx="17" fill="#e1ebe3"/><text x="169" y="410" text-anchor="middle" fill="#315348" font-family="sans-serif" font-size="22" font-weight="700">限定可用资金</text><rect x="286" y="370" width="195" height="62" rx="17" fill="#eee7d7"/><text x="383" y="410" text-anchor="middle" fill="#6f6241" font-family="sans-serif" font-size="22" font-weight="700">逐项设权限</text><rect x="500" y="370" width="195" height="62" rx="17" fill="#f1e2d9"/><text x="597" y="410" text-anchor="middle" fill="#885f4b" font-family="sans-serif" font-size="22" font-weight="700">确认每次操作</text>
<text x="72" y="548" fill="#777a70" font-family="sans-serif" font-size="18">隔离账户能限制访问范围，不能判断AI指令正确与否</text></svg>
