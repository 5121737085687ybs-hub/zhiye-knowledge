<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Telegram 中文界面和语言包切换步骤</title><desc id="desc">先从应用设置选择现有语言，再检查官方本地化平台上的社区语言包，确认完成度后应用并可随时切回。</desc>
<rect width="1200" height="570" rx="30" fill="#f5f2e9"/><text x="58" y="70" fill="#597267" font-family="sans-serif" font-size="19" letter-spacing="3">LANGUAGE SETTINGS</text><text x="58" y="125" fill="#203d34" font-family="sans-serif" font-size="38" font-weight="700">切换界面语言，先看来源与完成度</text>
<g font-family="sans-serif">
<rect x="58" y="190" width="314" height="235" rx="24" fill="#e1ebe3"/><circle cx="104" cy="238" r="25" fill="#315348"/><text x="104" y="246" fill="#fffdf8" font-size="21" font-weight="700" text-anchor="middle">1</text><text x="145" y="246" fill="#315348" font-size="20" font-weight="700">应用内语言列表</text><text x="88" y="303" fill="#263d35" font-size="25" font-weight="700">设置 → 语言</text><text x="88" y="347" fill="#62746a" font-size="18">先选择列表中可用的</text><text x="88" y="376" fill="#62746a" font-size="18">简体或繁体中文。</text>
<rect x="443" y="190" width="314" height="235" rx="24" fill="#eee7d7"/><circle cx="489" cy="238" r="25" fill="#846a27"/><text x="489" y="246" fill="#fffdf8" font-size="21" font-weight="700" text-anchor="middle">2</text><text x="530" y="246" fill="#846a27" font-size="20" font-weight="700">查看语言包信息</text><text x="473" y="303" fill="#403e35" font-size="24" font-weight="700">核实官方入口</text><text x="473" y="347" fill="#746c58" font-size="18">注意语言名称、来源</text><text x="473" y="376" fill="#746c58" font-size="18">和社区翻译完成度。</text>
<rect x="828" y="190" width="314" height="235" rx="24" fill="#f1e2d9"/><circle cx="874" cy="238" r="25" fill="#a36f55"/><text x="874" y="246" fill="#fffdf8" font-size="21" font-weight="700" text-anchor="middle">3</text><text x="915" y="246" fill="#a36f55" font-size="20" font-weight="700">应用或切回</text><text x="858" y="303" fill="#554237" font-size="24" font-weight="700">不合适就恢复</text><text x="858" y="347" fill="#826b5d" font-size="18">回到设置里的 Language</text><text x="858" y="376" fill="#826b5d" font-size="18">随时选择其他界面语言。</text></g>
<g stroke="#82948b" stroke-width="4"><path d="M372 308h62"/><path d="M757 308h62"/></g><g fill="#82948b"><path d="m422 300 12 8-12 8z"/><path d="m807 300 12 8-12 8z"/></g>
<rect x="58" y="463" width="1084" height="56" rx="28" fill="#315348"/><text x="600" y="498" fill="#fffdf8" font-family="sans-serif" font-size="19" font-weight="700" text-anchor="middle">界面本地化不需要安装陌生 APK、压缩包或配置文件。</text>
</svg>

