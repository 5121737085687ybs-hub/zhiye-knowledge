<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="28" fill="#eef1e9"/><text x="60" y="75" font-size="34" font-weight="700" fill="#293a31" font-family="sans-serif">一笔现货交易的核对路径</text><g font-family="sans-serif" text-anchor="middle"><rect x="55" y="155" width="235" height="220" rx="22" fill="#fffdf8"/><circle cx="172" cy="220" r="34" fill="#d8e7dc"/><text x="172" y="231" font-size="30" fill="#41634e">1</text><text x="172" y="290" font-size="27" font-weight="700" fill="#293a31">选交易对</text><text x="172" y="333" font-size="20" fill="#606b64">币种 / 报价币</text><rect x="350" y="155" width="235" height="220" rx="22" fill="#fffdf8"/><circle cx="467" cy="220" r="34" fill="#f1dfd2"/><text x="467" y="231" font-size="30" fill="#8b513a">2</text><text x="467" y="290" font-size="27" font-weight="700" fill="#293a31">选订单</text><text x="467" y="333" font-size="20" fill="#606b64">市价 / 限价等</text><rect x="645" y="155" width="235" height="220" rx="22" fill="#fffdf8"/><circle cx="762" cy="220" r="34" fill="#d8e7dc"/><text x="762" y="231" font-size="30" fill="#41634e">3</text><text x="762" y="290" font-size="27" font-weight="700" fill="#293a31">核对数量</text><text x="762" y="333" font-size="20" fill="#606b64">金额 / 成交估值</text><rect x="940" y="155" width="205" height="220" rx="22" fill="#fffdf8"/><circle cx="1042" cy="220" r="34" fill="#f1dfd2"/><text x="1042" y="231" font-size="30" fill="#8b513a">4</text><text x="1042" y="290" font-size="27" font-weight="700" fill="#293a31">检查结果</text><text x="1042" y="333" font-size="20" fill="#606b64">成交 / 委托纪录</text></g><path d="M300 265h42M595 265h42M890 265h42" stroke="#b87554" stroke-width="8" stroke-linecap="round"/><text x="60" y="445" font-size="23" fill="#59655e" font-family="sans-serif">下单画面的可用功能、交易对和规则会因帐户资格及地区而异；请以登入后显示为准。</text></svg>