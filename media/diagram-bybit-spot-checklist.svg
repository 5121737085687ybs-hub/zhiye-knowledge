<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="28" fill="#eef1e9"/><text x="60" y="75" font-size="34" font-weight="700" fill="#293a31" font-family="sans-serif">一筆現貨交易的核對路徑</text><g font-family="sans-serif" text-anchor="middle"><rect x="55" y="155" width="235" height="220" rx="22" fill="#fffdf8"/><circle cx="172" cy="220" r="34" fill="#d8e7dc"/><text x="172" y="231" font-size="30" fill="#41634e">1</text><text x="172" y="290" font-size="27" font-weight="700" fill="#293a31">選交易對</text><text x="172" y="333" font-size="20" fill="#606b64">幣種 / 報價幣</text><rect x="350" y="155" width="235" height="220" rx="22" fill="#fffdf8"/><circle cx="467" cy="220" r="34" fill="#f1dfd2"/><text x="467" y="231" font-size="30" fill="#8b513a">2</text><text x="467" y="290" font-size="27" font-weight="700" fill="#293a31">選訂單</text><text x="467" y="333" font-size="20" fill="#606b64">市價 / 限價等</text><rect x="645" y="155" width="235" height="220" rx="22" fill="#fffdf8"/><circle cx="762" cy="220" r="34" fill="#d8e7dc"/><text x="762" y="231" font-size="30" fill="#41634e">3</text><text x="762" y="290" font-size="27" font-weight="700" fill="#293a31">核對數量</text><text x="762" y="333" font-size="20" fill="#606b64">金額 / 成交估值</text><rect x="940" y="155" width="205" height="220" rx="22" fill="#fffdf8"/><circle cx="1042" cy="220" r="34" fill="#f1dfd2"/><text x="1042" y="231" font-size="30" fill="#8b513a">4</text><text x="1042" y="290" font-size="27" font-weight="700" fill="#293a31">檢查結果</text><text x="1042" y="333" font-size="20" fill="#606b64">成交 / 委託紀錄</text></g><path d="M300 265h42M595 265h42M890 265h42" stroke="#b87554" stroke-width="8" stroke-linecap="round"/><text x="60" y="445" font-size="23" fill="#59655e" font-family="sans-serif">下單畫面的可用功能、交易對和規則會因帳戶資格及地區而異；請以登入後顯示為準。</text></svg>