<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"><rect width="1200" height="440" rx="28" fill="#f4f7fb"/><text x="600" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">設定前先核對三個環節</text><g font-family="Arial,sans-serif"><rect x="70" y="130" width="320" height="220" rx="22" fill="#fff" stroke="#d8e1ef" stroke-width="3"/><circle cx="130" cy="190" r="32" fill="#f7a928"/><text x="130" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#17243b">1</text><text x="180" y="200" font-size="26" font-weight="700" fill="#17243b">觸發依據</text><text x="105" y="260" font-size="20" fill="#52627a">最新成交價？標記價格？</text><text x="105" y="294" font-size="20" fill="#52627a">確認平台欄位定義</text><rect x="440" y="130" width="320" height="220" rx="22" fill="#fff" stroke="#d8e1ef" stroke-width="3"/><circle cx="500" cy="190" r="32" fill="#70d6b5"/><text x="500" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#17243b">2</text><text x="550" y="200" font-size="26" font-weight="700" fill="#17243b">執行方式</text><text x="475" y="260" font-size="20" fill="#52627a">市價可能滑價</text><text x="475" y="294" font-size="20" fill="#52627a">限價可能未成交</text><rect x="810" y="130" width="320" height="220" rx="22" fill="#fff" stroke="#d8e1ef" stroke-width="3"/><circle cx="870" cy="190" r="32" fill="#7898ef"/><text x="870" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">3</text><text x="920" y="200" font-size="26" font-weight="700" fill="#17243b">倉位範圍</text><text x="845" y="260" font-size="20" fill="#52627a">全部或部分平倉？</text><text x="845" y="294" font-size="20" fill="#52627a">確認數量及委託狀態</text></g></svg>