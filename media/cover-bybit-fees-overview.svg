<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f2efe7"/><rect x="70" y="70" width="1060" height="580" rx="34" fill="#fffdf8" stroke="#d7d2c7" stroke-width="3"/><text x="125" y="175" font-size="30" fill="#577463" font-family="sans-serif">BYBIT · 費用拆解</text><text x="125" y="275" font-size="62" font-weight="700" fill="#26372e" font-family="sans-serif">交易成本不只費率</text><text x="125" y="345" font-size="31" fill="#59655e" font-family="sans-serif">看清成交費、借款、資金與網路費</text><g font-family="sans-serif"><rect x="130" y="420" width="210" height="95" rx="16" fill="#e6eee8"/><text x="235" y="478" text-anchor="middle" font-size="25" fill="#26372e">交易費</text><rect x="375" y="420" width="210" height="95" rx="16" fill="#f4e6dc"/><text x="480" y="478" text-anchor="middle" font-size="25" fill="#26372e">資金費用</text><rect x="620" y="420" width="210" height="95" rx="16" fill="#e6eee8"/><text x="725" y="478" text-anchor="middle" font-size="25" fill="#26372e">借款利息</text><rect x="865" y="420" width="210" height="95" rx="16" fill="#f4e6dc"/><text x="970" y="478" text-anchor="middle" font-size="25" fill="#26372e">點差與滑價</text></g><text x="125" y="575" font-size="23" fill="#59655e" font-family="sans-serif">實際費率以帳戶等級及產品頁面為準</text></svg>