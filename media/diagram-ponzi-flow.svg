<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">资金盘承诺收益到提现受阻的循环</title>
  <desc id="desc">项目承诺回报，吸引新资金并向早期参与者显示回报；宣传和招募带来更多资金，资金增速放缓后提现可能受阻。</desc>
  <rect width="1200" height="760" rx="22" fill="#f1f0e8"/>
  <text x="70" y="88" fill="#20241f" font-family="'Songti SC','Noto Serif CJK SC',serif" font-size="48">看一笔资金如何形成循环</text>
  <text x="72" y="130" fill="#777a70" font-family="Arial,sans-serif" font-size="20" letter-spacing="2">识别重点是收入来源，而不是项目用了什么技术</text>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <g transform="translate(70 210)">
      <rect width="300" height="150" rx="14" fill="#fffefa"/>
      <circle cx="54" cy="55" r="27" fill="#f1e4d8"/>
      <text x="54" y="64" fill="#c7794b" font-size="25" font-weight="700">01</text>
      <text x="180" y="72" fill="#20241f" font-size="29" font-weight="700">承诺回报</text>
      <text x="150" y="120" fill="#777a70" font-size="20">固定、高额、低风险</text>
    </g>
    <g transform="translate(450 210)">
      <rect width="300" height="150" rx="14" fill="#fffefa"/>
      <circle cx="54" cy="55" r="27" fill="#e4e9dc"/>
      <text x="54" y="64" fill="#536b48" font-size="25" font-weight="700">02</text>
      <text x="180" y="72" fill="#20241f" font-size="29" font-weight="700">新资金进入</text>
      <text x="150" y="120" fill="#777a70" font-size="20">充值、套餐或入会</text>
    </g>
    <g transform="translate(830 210)">
      <rect width="300" height="150" rx="14" fill="#fffefa"/>
      <circle cx="54" cy="55" r="27" fill="#e4e9dc"/>
      <text x="54" y="64" fill="#536b48" font-size="25" font-weight="700">03</text>
      <text x="180" y="72" fill="#20241f" font-size="29" font-weight="700">显示早期回报</text>
      <text x="150" y="120" fill="#777a70" font-size="20">余额与截图制造信任</text>
    </g>
    <g transform="translate(830 470)">
      <rect width="300" height="150" rx="14" fill="#fffefa"/>
      <circle cx="54" cy="55" r="27" fill="#f1e4d8"/>
      <text x="54" y="64" fill="#c7794b" font-size="25" font-weight="700">04</text>
      <text x="180" y="72" fill="#20241f" font-size="29" font-weight="700">继续拉新</text>
      <text x="150" y="120" fill="#777a70" font-size="20">返利、等级与复投</text>
    </g>
    <g transform="translate(450 470)">
      <rect width="300" height="150" rx="14" fill="#30452f"/>
      <circle cx="54" cy="55" r="27" fill="#52684a"/>
      <text x="54" y="64" fill="#e2e99e" font-size="25" font-weight="700">05</text>
      <text x="180" y="72" fill="#fffefa" font-size="29" font-weight="700">提现受阻</text>
      <text x="150" y="120" fill="#d2d8c7" font-size="20">拖延、限额或追加收费</text>
    </g>
  </g>
  <g stroke="#c7794b" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M380 285H430"/>
    <path d="M760 285H810"/>
    <path d="M980 370V445"/>
    <path d="M820 545H760"/>
    <path d="M900 465V415H700V374"/>
  </g>
  <g fill="#c7794b">
    <path d="m430 285-15-9v18z"/>
    <path d="m810 285-15-9v18z"/>
    <path d="m980 445-9-16h18z"/>
    <path d="m760 545 16-9v18z"/>
    <path d="m700 374-9 16h18z"/>
  </g>
  <rect x="70" y="665" width="1060" height="54" rx="10" fill="#e4e9dc"/>
  <text x="600" y="700" text-anchor="middle" fill="#30452f" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700">早期有人提现成功，也不能证明项目有持续、真实的收入</text>
</svg>