<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">稳定币的价格支撑与风险来源</title>
  <desc id="desc">稳定币价格目标取决于发行机制、储备或抵押、赎回渠道和市场流动性。</desc>
  <rect width="1200" height="620" rx="36" fill="#f4f8f7"/>
  <text x="70" y="88" fill="#173b3b" font-family="Arial,sans-serif" font-size="34" font-weight="700">稳定币的四个关键环节</text>
  <text x="70" y="130" fill="#587070" font-family="Arial,sans-serif" font-size="20">价格目标依赖机制运作，也会受外部条件影响</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g><rect x="70" y="220" width="240" height="205" rx="24" fill="#fff" stroke="#a8ceca" stroke-width="3"/><circle cx="190" cy="275" r="32" fill="#d8efeb"/><text x="190" y="284" fill="#176c67" font-size="24" font-weight="700">1</text><text x="190" y="340" fill="#173b3b" font-size="24" font-weight="700">发行机制</text><text x="190" y="378" fill="#587070" font-size="17">法币储备 / 抵押 / 算法</text></g>
    <g><rect x="350" y="220" width="240" height="205" rx="24" fill="#fff" stroke="#a8ceca" stroke-width="3"/><circle cx="470" cy="275" r="32" fill="#d8efeb"/><text x="470" y="284" fill="#176c67" font-size="24" font-weight="700">2</text><text x="470" y="340" fill="#173b3b" font-size="24" font-weight="700">储备与抵押</text><text x="470" y="378" fill="#587070" font-size="17">质量、托管与透明度</text></g>
    <g><rect x="630" y="220" width="240" height="205" rx="24" fill="#fff" stroke="#a8ceca" stroke-width="3"/><circle cx="750" cy="275" r="32" fill="#d8efeb"/><text x="750" y="284" fill="#176c67" font-size="24" font-weight="700">3</text><text x="750" y="340" fill="#173b3b" font-size="24" font-weight="700">赎回渠道</text><text x="750" y="378" fill="#587070" font-size="17">资格、时间与费用</text></g>
    <g><rect x="910" y="220" width="220" height="205" rx="24" fill="#fff" stroke="#d9bba5" stroke-width="3"/><circle cx="1020" cy="275" r="32" fill="#f6e7dd"/><text x="1020" y="284" fill="#8a583f" font-size="24" font-weight="700">4</text><text x="1020" y="340" fill="#173b3b" font-size="24" font-weight="700">市场流动性</text><text x="1020" y="378" fill="#765e50" font-size="17">深度与网络可用性</text></g>
  </g>
  <g fill="none" stroke="#2c9187" stroke-width="5"><path d="M315 320h30"/><path d="M595 320h30"/><path d="M875 320h30"/></g>
  <rect x="70" y="475" width="1060" height="75" rx="18" fill="#f7e9e5"/><text x="600" y="521" text-anchor="middle" fill="#8c463a" font-family="Arial,sans-serif" font-size="20" font-weight="700">“锚定”与“储备”不是无风险或可随时按面值兑回的保证</text>
</svg>
