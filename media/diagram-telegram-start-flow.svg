<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Telegram 新手开始流程</title><desc id="desc">通过官方渠道安装，使用本人号码登录，先完成安全设置，再开始聊天。</desc>
<rect width="1200" height="590" rx="30" fill="#f5f2e9"/><text x="58" y="70" fill="#597267" font-family="sans-serif" font-size="19" letter-spacing="3">GETTING STARTED</text><text x="58" y="125" fill="#203d34" font-family="sans-serif" font-size="38" font-weight="700">从安装到发出第一条消息</text>
<g font-family="sans-serif" text-anchor="middle">
<rect x="55" y="205" width="245" height="225" rx="24" fill="#e1ebe3"/><circle cx="178" cy="263" r="27" fill="#315348"/><text x="178" y="272" fill="#fffdf8" font-size="22" font-weight="700">1</text><text x="178" y="328" fill="#263d35" font-size="25" font-weight="700">官方渠道安装</text><text x="178" y="365" fill="#62746a" font-size="17">核对开发者与应用来源</text><text x="178" y="392" fill="#62746a" font-size="17">及时更新客户端</text>
<rect x="350" y="205" width="245" height="225" rx="24" fill="#eee7d7"/><circle cx="473" cy="263" r="27" fill="#846a27"/><text x="473" y="272" fill="#fffdf8" font-size="22" font-weight="700">2</text><text x="473" y="328" fill="#403e35" font-size="25" font-weight="700">本人号码登录</text><text x="473" y="365" fill="#746c58" font-size="17">保留号码使用权</text><text x="473" y="392" fill="#746c58" font-size="17">验证码绝不转发给别人</text>
<rect x="645" y="205" width="245" height="225" rx="24" fill="#e1ebe3"/><circle cx="768" cy="263" r="27" fill="#315348"/><text x="768" y="272" fill="#fffdf8" font-size="22" font-weight="700">3</text><text x="768" y="328" fill="#263d35" font-size="25" font-weight="700">先完成安全设置</text><text x="768" y="365" fill="#62746a" font-size="17">两步验证、设备锁</text><text x="768" y="392" fill="#62746a" font-size="17">检查号码与会话隐私</text>
<rect x="940" y="205" width="205" height="225" rx="24" fill="#f1e2d9"/><circle cx="1042" cy="263" r="27" fill="#a36f55"/><text x="1042" y="272" fill="#fffdf8" font-size="22" font-weight="700">4</text><text x="1042" y="328" fill="#554237" font-size="25" font-weight="700">开始交流</text><text x="1042" y="365" fill="#826b5d" font-size="17">私聊、群组或频道</text><text x="1042" y="392" fill="#826b5d" font-size="17">陌生链接先核验</text></g>
<g stroke="#82948b" stroke-width="4"><path d="M300 316h42"/><path d="M595 316h42"/><path d="M890 316h42"/></g><g fill="#82948b"><path d="m332 308 12 8-12 8z"/><path d="m627 308 12 8-12 8z"/><path d="m922 308 12 8-12 8z"/></g>
<text x="58" y="500" fill="#53645b" font-family="sans-serif" font-size="18">下载入口：telegram.org/apps · 不从陌生私信、广告附件或非官方网盘安装应用。</text>
</svg>
