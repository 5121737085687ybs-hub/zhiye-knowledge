<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">流动性质押的资产路径</title><desc id="desc">资产进入协议并委托验证者，用户获得代币化凭证，可等待赎回或在二级市场交易。</desc>
  <rect width="1200" height="630" rx="36" fill="#f3f4ef"/><text x="72" y="92" fill="#315348" font-family="sans-serif" font-size="22" letter-spacing="4">LIQUID STAKING · ASSET FLOW</text><text x="72" y="158" fill="#203d34" font-family="sans-serif" font-size="46" font-weight="700">流动凭证让资产可用，也增加风险</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="70" y="244" width="240" height="176" rx="24" fill="#fffdf7" stroke="#83a494" stroke-width="3"/><text x="190" y="297" fill="#315348" font-size="22">用户存入</text><text x="190" y="350" fill="#263d35" font-size="26">原生资产</text><text x="190" y="385" fill="#65746d" font-size="17">由协议接收</text>
  <rect x="350" y="244" width="240" height="176" rx="24" fill="#e1ebe3"/><text x="470" y="297" fill="#315348" font-size="22">协议委托</text><text x="470" y="350" fill="#263d35" font-size="26">验证者质押</text><text x="470" y="385" fill="#65746d" font-size="17">奖励与罚没规则</text>
  <rect x="630" y="244" width="240" height="176" rx="24" fill="#eee7d7"/><text x="750" y="297" fill="#816a31" font-size="22">用户取得</text><text x="750" y="350" fill="#403e35" font-size="26">代币化凭证</text><text x="750" y="385" fill="#746c58" font-size="17">价格可能偏离</text>
  <rect x="910" y="244" width="240" height="176" rx="24" fill="#fffdf7" stroke="#c8b573" stroke-width="3"/><text x="1030" y="297" fill="#846a27" font-size="22">退出路径</text><text x="1030" y="350" fill="#403e35" font-size="26">排队赎回 / 卖出</text><text x="1030" y="385" fill="#746c58" font-size="17">时间与流动性风险</text></g>
  <g stroke="#82948b" stroke-width="4"><path d="M310 332h40"/><path d="M590 332h40"/><path d="M870 332h40"/></g><g fill="#82948b"><path d="m339 324 12 8-12 8z"/><path d="m619 324 12 8-12 8z"/><path d="m899 324 12 8-12 8z"/></g>
  <text x="72" y="510" fill="#43584f" font-family="sans-serif" font-size="21">验证者、合约、赎回队列与二级市场的风险可能同时存在。</text><text x="72" y="566" fill="#839087" font-family="sans-serif" font-size="16">知页 · 一般知识分享</text>
</svg>
