<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">自动交易策略结果的影响因素</title><desc id="desc">市场走势、参数边界、仓位与成本会共同影响网格和自动化交易结果。</desc>
  <rect width="1200" height="630" rx="36" fill="#f4f4ee"/><text x="72" y="92" fill="#315348" font-family="sans-serif" font-size="22" letter-spacing="4">AUTOMATION · CONDITIONS &amp; LIMITS</text><text x="72" y="158" fill="#203d34" font-family="sans-serif" font-size="46" font-weight="700">机器人只按规则执行，不替你判断</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="74" y="236" width="245" height="170" rx="24" fill="#e1ebe3"/><text x="196" y="287" fill="#315348" font-size="21">市场走势</text><text x="196" y="339" fill="#263d35" font-size="25">区间 / 趋势</text><text x="196" y="375" fill="#65746d" font-size="17">策略可能失效</text>
  <rect x="349" y="236" width="245" height="170" rx="24" fill="#eee7d7"/><text x="471" y="287" fill="#846a27" font-size="21">策略参数</text><text x="471" y="339" fill="#403e35" font-size="25">价格 / 间隔</text><text x="471" y="375" fill="#746c58" font-size="17">过拟合历史数据</text>
  <rect x="624" y="236" width="245" height="170" rx="24" fill="#e1ebe3"/><text x="746" y="287" fill="#315348" font-size="21">仓位规则</text><text x="746" y="339" fill="#263d35" font-size="25">限额 / 杠杆</text><text x="746" y="375" fill="#65746d" font-size="17">加仓可能扩大回撤</text>
  <rect x="899" y="236" width="245" height="170" rx="24" fill="#eee7d7"/><text x="1021" y="287" fill="#846a27" font-size="21">实际成本</text><text x="1021" y="339" fill="#403e35" font-size="25">费用 / 滑点</text><text x="1021" y="375" fill="#746c58" font-size="17">系统也可能中断</text></g>
  <text x="72" y="497" fill="#43584f" font-family="sans-serif" font-size="21">先设风险上限和停止条件，再用模拟或小额观察策略行为。</text><text x="72" y="556" fill="#839087" font-family="sans-serif" font-size="16">知页 · 一般知识分享</text>
</svg>
