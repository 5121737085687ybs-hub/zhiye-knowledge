<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="24" fill="#101827"/><text x="60" y="75" fill="#ffffff" font-family="Arial,sans-serif" font-size="33" font-weight="700">现货下单与成交核对</text><rect x="70" y="180" width="205" height="170" rx="20" fill="#1b2a3d"/><text x="172" y="238" text-anchor="middle" fill="#c5ff2f" font-family="Arial,sans-serif" font-size="24" font-weight="700">1 · 选交易对</text><text x="172" y="292" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="18">币种与账户</text><rect x="355" y="180" width="205" height="170" rx="20" fill="#1b2a3d"/><text x="457" y="238" text-anchor="middle" fill="#c5ff2f" font-family="Arial,sans-serif" font-size="24" font-weight="700">2 · 设订单</text><text x="457" y="292" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="18">市价或限价</text><rect x="640" y="180" width="205" height="170" rx="20" fill="#1b2a3d"/><text x="742" y="238" text-anchor="middle" fill="#c5ff2f" font-family="Arial,sans-serif" font-size="24" font-weight="700">3 · 核对费用</text><text x="742" y="292" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="18">数量与预计成本</text><rect x="925" y="180" width="205" height="170" rx="20" fill="#1b2a3d"/><text x="1027" y="238" text-anchor="middle" fill="#c5ff2f" font-family="Arial,sans-serif" font-size="24" font-weight="700">4 · 查成交</text><text x="1027" y="292" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="18">订单状态与余额</text><path d="M275 265h75" stroke="#c5ff2f" stroke-width="4"/><path d="M335 255l15 10-15 10" fill="none" stroke="#c5ff2f" stroke-width="4"/><path d="M560 265h75" stroke="#c5ff2f" stroke-width="4"/><path d="M620 255l15 10-15 10" fill="none" stroke="#c5ff2f" stroke-width="4"/><path d="M845 265h75" stroke="#c5ff2f" stroke-width="4"/><path d="M905 255l15 10-15 10" fill="none" stroke="#c5ff2f" stroke-width="4"/><rect x="70" y="430" width="1060" height="95" rx="18" fill="#18263a"/><text x="600" y="488" text-anchor="middle" fill="#d2dbe8" font-family="Arial,sans-serif" font-size="22">核实规则与资格　·　勿跳过确认　·　以账户页面为准</text></svg>