<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="28" fill="#f2eee5"/><text x="56" y="68" fill="#17232e" font-family="sans-serif" font-size="30" font-weight="700">盘前永续的阶段变化</text><rect x="58" y="130" width="285" height="190" rx="20" fill="#e9ddc8"/><text x="86" y="180" fill="#17232e" font-family="sans-serif" font-size="24">集合竞价</text><text x="86" y="222" fill="#455b60" font-family="sans-serif" font-size="18">收集买卖委托</text><text x="86" y="255" fill="#455b60" font-family="sans-serif" font-size="18">按规则形成撮合价</text><text x="86" y="288" fill="#455b60" font-family="sans-serif" font-size="18">部分阶段限制撤单</text><path d="M362 225h92" stroke="#d28a46" stroke-width="7"/><path d="m437 203 22 22-22 22" fill="none" stroke="#d28a46" stroke-width="7"/><rect x="474" y="130" width="270" height="190" rx="20" fill="#d8e5dc"/><text x="503" y="180" fill="#17232e" font-family="sans-serif" font-size="24">连续撮合</text><text x="503" y="222" fill="#455b60" font-family="sans-serif" font-size="18">按订单簿成交</text><text x="503" y="255" fill="#455b60" font-family="sans-serif" font-size="18">杠杆与保证金生效</text><text x="503" y="288" fill="#455b60" font-family="sans-serif" font-size="18">价格可能剧烈波动</text><path d="M763 225h92" stroke="#d28a46" stroke-width="7"/><path d="m838 203 22 22-22 22" fill="none" stroke="#d28a46" stroke-width="7"/><rect x="875" y="130" width="170" height="190" rx="20" fill="#dce1eb"/><text x="896" y="180" fill="#17232e" font-family="sans-serif" font-size="23">常规永续</text><text x="896" y="222" fill="#455b60" font-family="sans-serif" font-size="17">仅在平台</text><text x="896" y="253" fill="#455b60" font-family="sans-serif" font-size="17">条件满足时</text><text x="896" y="284" fill="#455b60" font-family="sans-serif" font-size="17">才可能转换</text><rect x="58" y="372" width="987" height="90" rx="18" fill="#17232e"/><text x="86" y="411" fill="#e9ad65" font-family="sans-serif" font-size="20">提交前确认</text><text x="260" y="411" fill="#f4f0e8" font-family="sans-serif" font-size="19">合约标的</text><text x="420" y="411" fill="#f4f0e8" font-family="sans-serif" font-size="19">保证金占用</text><text x="616" y="411" fill="#f4f0e8" font-family="sans-serif" font-size="19">撤单规则</text><text x="780" y="411" fill="#f4f0e8" font-family="sans-serif" font-size="19">强平条件</text><text x="260" y="442" fill="#bdcbc4" font-family="sans-serif" font-size="17">价格与现货上市后可能明显不同</text></svg>