<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><rect width="1200" height="700" rx="36" fill="#202b36"/><rect x="780" y="0" width="420" height="700" fill="#30434b"/><text x="88" y="105" fill="#e9ad65" font-family="sans-serif" font-size="24" letter-spacing="5">BYBIT · BEFORE LISTING</text><text x="88" y="215" fill="#f4f0e8" font-family="sans-serif" font-size="60" font-weight="700">盘前永续</text><text x="88" y="275" fill="#bdcbc4" font-family="sans-serif" font-size="29">正式现货上市前，先认识合约阶段</text><path d="M112 500H1060" stroke="#60716f" stroke-width="3"/><path d="M160 463h235v-104h240v68h258v-190h80" fill="none" stroke="#e9ad65" stroke-width="8"/><circle cx="160" cy="463" r="12" fill="#e9ad65"/><circle cx="395" cy="359" r="12" fill="#e9ad65"/><circle cx="635" cy="427" r="12" fill="#e9ad65"/><circle cx="893" cy="237" r="12" fill="#e9ad65"/><text x="115" y="550" fill="#f4f0e8" font-family="sans-serif" font-size="21">集合竞价</text><text x="385" y="550" fill="#f4f0e8" font-family="sans-serif" font-size="21">连续撮合</text><text x="640" y="550" fill="#f4f0e8" font-family="sans-serif" font-size="21">可能转为常规永续</text><text x="88" y="638" fill="#bdcbc4" font-family="sans-serif" font-size="22">参考价格不等于正式现货上市价格；转为常规合约也无保证</text></svg>