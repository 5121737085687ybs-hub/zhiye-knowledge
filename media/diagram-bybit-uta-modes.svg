<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><rect width="1200" height="430" rx="24" fill="#f4f7fb"/><text x="600" y="64" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#17243b">保证金模式的风险范围不同</text><g font-family="Arial" text-anchor="middle"><rect x="70" y="120" width="330" height="240" rx="22" fill="#fff" stroke="#d5dfed" stroke-width="3"/><text x="235" y="175" font-size="26" font-weight="700" fill="#17243b">逐仓</text><text x="235" y="225" font-size="20" fill="#52627a">风险主要按单个仓位</text><text x="235" y="260" font-size="20" fill="#52627a">分配保证金计算</text><text x="235" y="315" font-size="17" fill="#d16b5e">仍可能强平</text><rect x="435" y="120" width="330" height="240" rx="22" fill="#fff" stroke="#d5dfed" stroke-width="3"/><text x="600" y="175" font-size="26" font-weight="700" fill="#17243b">全仓</text><text x="600" y="225" font-size="20" fill="#52627a">合资格资产共同</text><text x="600" y="260" font-size="20" fill="#52627a">支持账户仓位</text><text x="600" y="315" font-size="17" fill="#d16b5e">仓位风险会联动</text><rect x="800" y="120" width="330" height="240" rx="22" fill="#fff" stroke="#d5dfed" stroke-width="3"/><text x="965" y="175" font-size="26" font-weight="700" fill="#17243b">组合保证金</text><text x="965" y="225" font-size="20" fill="#52627a">按组合风险计算</text><text x="965" y="260" font-size="20" fill="#52627a">抵押要求</text><text x="965" y="315" font-size="17" fill="#d16b5e">机制更复杂</text></g></svg>