<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">新代币发行参与前的核对步骤</title><desc id="desc">核对资格和资金条件、供应分配、锁定安排、领取过程和退出限制。</desc>
  <rect width="1200" height="630" rx="36" fill="#f5f2e9"/><text x="72" y="92" fill="#315348" font-family="sans-serif" font-size="22" letter-spacing="4">TOKEN DISTRIBUTION · BEFORE YOU JOIN</text><text x="72" y="158" fill="#203d34" font-family="sans-serif" font-size="46" font-weight="700">先读规则，再判断是否参与</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="72" y="238" width="200" height="158" rx="22" fill="#e1ebe3"/><text x="172" y="288" fill="#315348" font-size="20">01</text><text x="172" y="337" fill="#263d35" font-size="24" font-weight="700">资格与资金</text><text x="172" y="369" fill="#65746d" font-size="16">门槛 / 锁定</text>
  <rect x="302" y="238" width="200" height="158" rx="22" fill="#eee7d7"/><text x="402" y="288" fill="#846a27" font-size="20">02</text><text x="402" y="337" fill="#403e35" font-size="24" font-weight="700">供应分配</text><text x="402" y="369" fill="#746c58" font-size="16">解锁 / 归属</text>
  <rect x="532" y="238" width="200" height="158" rx="22" fill="#e1ebe3"/><text x="632" y="288" fill="#315348" font-size="20">03</text><text x="632" y="337" fill="#263d35" font-size="24" font-weight="700">领取安全</text><text x="632" y="369" fill="#65746d" font-size="16">域名 / 合约</text>
  <rect x="762" y="238" width="200" height="158" rx="22" fill="#eee7d7"/><text x="862" y="288" fill="#846a27" font-size="20">04</text><text x="862" y="337" fill="#403e35" font-size="24" font-weight="700">退出方式</text><text x="862" y="369" fill="#746c58" font-size="16">赎回 / 流动性</text>
  <rect x="992" y="238" width="136" height="158" rx="22" fill="#315348"/><text x="1060" y="292" fill="#dce8df" font-size="20">记住</text><text x="1060" y="337" fill="#fffdf7" font-size="22" font-weight="700">奖励</text><text x="1060" y="369" fill="#dce8df" font-size="16">不是保证</text></g>
  <text x="72" y="490" fill="#43584f" font-family="sans-serif" font-size="21">空投与新币活动也有资金、合约和价格风险。</text><text x="72" y="552" fill="#839087" font-family="sans-serif" font-size="16">知页 · 一般知识分享</text>
</svg>
