<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Bybit AI子账户安全设置流程</title><desc id="desc">先分辨Bybit内置AI和外部AI助手，再授权AI子账户、限制资金和权限、逐笔核对执行。</desc>
<rect width="1200" height="740" rx="28" fill="#f5f2e9"/><text x="70" y="72" fill="#597267" font-family="sans-serif" font-size="18" letter-spacing="3">知页 · AI权限检查</text><text x="70" y="135" fill="#203d34" font-family="sans-serif" font-size="42" font-weight="700">连接前后都要留一道检查</text>
<g font-family="sans-serif"><rect x="75" y="205" width="240" height="145" rx="22" fill="#e1ebe3"/><text x="195" y="255" text-anchor="middle" fill="#315348" font-size="24" font-weight="700">1. 分辨入口</text><text x="195" y="297" text-anchor="middle" fill="#496057" font-size="18">Bybit内置AI？</text><text x="195" y="326" text-anchor="middle" fill="#496057" font-size="18">还是外部AI工具？</text>
<rect x="355" y="205" width="240" height="145" rx="22" fill="#eee7d7"/><text x="475" y="255" text-anchor="middle" fill="#6f6241" font-size="24" font-weight="700">2. 核对授权</text><text x="475" y="297" text-anchor="middle" fill="#746c58" font-size="18">只通过账户内官方流程</text><text x="475" y="326" text-anchor="middle" fill="#746c58" font-size="18">确认连接对象和范围</text>
<rect x="635" y="205" width="240" height="145" rx="22" fill="#f1e2d9"/><text x="755" y="255" text-anchor="middle" fill="#885f4b" font-size="24" font-weight="700">3. 限制资金</text><text x="755" y="297" text-anchor="middle" fill="#826b5d" font-size="18">设转入额度与资产上限</text><text x="755" y="326" text-anchor="middle" fill="#826b5d" font-size="18">从可承受损失范围起步</text>
<rect x="915" y="205" width="240" height="145" rx="22" fill="#dce5df"/><text x="1035" y="255" text-anchor="middle" fill="#536b48" font-size="24" font-weight="700">4. 逐笔确认</text><text x="1035" y="297" text-anchor="middle" fill="#496057" font-size="18">核对方向、数量、杠杆</text><text x="1035" y="326" text-anchor="middle" fill="#496057" font-size="18">不清楚就不要授权</text></g>
<g stroke="#c7794b" stroke-width="5" fill="none" stroke-linecap="round"><path d="M315 278h40m-12-12 12 12-12 12M595 278h40m-12-12 12 12-12 12M875 278h40m-12-12 12 12-12 12"/></g>
<rect x="75" y="420" width="1080" height="150" rx="24" fill="#fffdf8" stroke="#b7bdab" stroke-width="2"/><text x="115" y="470" fill="#203d34" font-size="23" font-family="sans-serif" font-weight="700">可调整的控制项</text><text x="115" y="515" fill="#496057" font-size="20" font-family="sans-serif">每日转入限额 · 子账户资产上限 · 杠杆权限 · API有效期 · 访问撤销方式</text>
<text x="75" y="635" fill="#777a70" font-family="sans-serif" font-size="18">默认数值和功能可能改变；请以当前账户页面显示为准。</text><text x="75" y="675" fill="#885f4b" font-family="sans-serif" font-size="17">AI可能误解指令或产生错误建议。账户隔离与人工审核都不能消除交易亏损。</text></svg>
