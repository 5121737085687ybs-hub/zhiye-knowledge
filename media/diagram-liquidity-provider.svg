<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">流动性提供者的回报和风险</title><desc id="desc">交易费和激励与资产比例变化、合约、网络和退出条件共同决定结果。</desc>
  <rect width="1200" height="630" rx="36" fill="#f4f4ee"/><text x="72" y="92" fill="#315348" font-family="sans-serif" font-size="22" letter-spacing="4">LIQUIDITY PROVIDING · OUTCOMES</text><text x="72" y="158" fill="#203d34" font-family="sans-serif" font-size="46" font-weight="700">费用收入只是结果的一部分</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="80" y="228" width="300" height="192" rx="24" fill="#e1ebe3"/><text x="230" y="283" fill="#315348" font-size="22">可能获得</text><text x="230" y="337" fill="#263d35" font-size="26" font-weight="700">交易费 · 激励</text><text x="230" y="376" fill="#65746d" font-size="17">受池子规则与交易量影响</text>
  <rect x="450" y="228" width="300" height="192" rx="24" fill="#eee7d7"/><text x="600" y="283" fill="#846a27" font-size="22">同时承担</text><text x="600" y="337" fill="#403e35" font-size="26" font-weight="700">价格变化 · 合约</text><text x="600" y="376" fill="#746c58" font-size="17">资产比例与系统可能改变</text>
  <rect x="820" y="228" width="300" height="192" rx="24" fill="#e1ebe3"/><text x="970" y="283" fill="#315348" font-size="22">退出时面对</text><text x="970" y="337" fill="#263d35" font-size="26" font-weight="700">流动性 · 网络费</text><text x="970" y="376" fill="#65746d" font-size="17">池子与网络状况各异</text></g>
  <path d="M380 324h70m300 0h70" stroke="#82948b" stroke-width="4"/><path d="m438 316 12 8-12 8m358-16 12 8-12 8" fill="#82948b"/>
  <text x="72" y="502" fill="#43584f" font-family="sans-serif" font-size="21">回报率不能单独说明最终资产价值或损失范围。</text><text x="72" y="560" fill="#839087" font-family="sans-serif" font-size="16">知页 · 一般知识分享</text>
</svg>
