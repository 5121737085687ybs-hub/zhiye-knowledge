<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">现实资产代币化的权利关系</title>
  <desc id="desc">底层资产与链上代币之间依赖发行结构、托管安排和法律文件建立联系。</desc>
  <rect width="1200" height="620" rx="36" fill="#f4f8f7"/>
  <text x="70" y="88" fill="#173b3b" font-family="Arial,sans-serif" font-size="34" font-weight="700">代币与链下资产之间还隔着几层关系</text>
  <text x="70" y="130" fill="#587070" font-family="Arial,sans-serif" font-size="20">链上记录不自动等于资产所有权</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="70" y="235" width="250" height="170" rx="24" fill="#fff" stroke="#a8ceca" stroke-width="3"/><text x="195" y="295" fill="#173b3b" font-size="23" font-weight="700">链下资产</text><text x="195" y="340" fill="#587070" font-size="18">债券 · 黄金 · 权利</text>
    <rect x="370" y="235" width="250" height="170" rx="24" fill="#fff" stroke="#a8ceca" stroke-width="3"/><text x="495" y="295" fill="#173b3b" font-size="23" font-weight="700">发行与托管</text><text x="495" y="340" fill="#587070" font-size="18">主体 · 保管 · 估值</text>
    <rect x="670" y="235" width="250" height="170" rx="24" fill="#e8f2f1" stroke="#a8ceca" stroke-width="3"/><text x="795" y="295" fill="#176c67" font-size="23" font-weight="700">法律文件</text><text x="795" y="340" fill="#587070" font-size="18">定义持有人权利</text>
    <rect x="970" y="235" width="160" height="170" rx="24" fill="#fff" stroke="#d9bba5" stroke-width="3"/><text x="1050" y="295" fill="#8a583f" font-size="23" font-weight="700">链上代币</text><text x="1050" y="340" fill="#765e50" font-size="18">记录与转移</text>
  </g>
  <g fill="none" stroke="#2c9187" stroke-width="5" stroke-linecap="round"><path d="M325 320h38"/><path d="M625 320h38"/><path d="M925 320h38"/></g>
  <rect x="70" y="465" width="1060" height="75" rx="18" fill="#f7e9e5"/><text x="600" y="511" text-anchor="middle" fill="#8c463a" font-family="Arial,sans-serif" font-size="20" font-weight="700">核对赎回权、违约处理、发行人义务与适用法律</text>
</svg>
