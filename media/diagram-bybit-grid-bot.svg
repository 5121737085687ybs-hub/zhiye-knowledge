<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="28" fill="#f2eee5"/><text x="56" y="68" fill="#17232e" font-family="sans-serif" font-size="30" font-weight="700">网格收益和账户总结果不是同一数字</text><rect x="65" y="135" width="430" height="220" rx="20" fill="#d8e5dc"/><text x="98" y="188" fill="#17232e" font-family="sans-serif" font-size="24" font-weight="700">区间内反复成交</text><path d="M110 286h340" stroke="#9ea49f" stroke-width="2"/><path d="M130 270 180 220 230 270 280 220 330 270 380 220 430 270" fill="none" stroke="#2c6960" stroke-width="6"/><text x="98" y="329" fill="#455b60" font-family="sans-serif" font-size="18">已完成配对产生网格收益</text><rect x="535" y="135" width="500" height="220" rx="20" fill="#e7cfbf"/><text x="570" y="188" fill="#17232e" font-family="sans-serif" font-size="24" font-weight="700">区间外仍有仓位风险</text><path d="M580 270h400" stroke="#9ea49f" stroke-width="2"/><path d="M595 220 690 235 785 264 880 295 965 323" fill="none" stroke="#b76745" stroke-width="6"/><text x="570" y="329" fill="#455b60" font-family="sans-serif" font-size="18">未实现盈亏可能抵消已实现收益</text><rect x="65" y="402" width="970" height="54" rx="15" fill="#17232e"/><text x="94" y="438" fill="#f4f0e8" font-family="sans-serif" font-size="19">合约网格还要检查保证金、资金费用和强平条件。</text></svg>