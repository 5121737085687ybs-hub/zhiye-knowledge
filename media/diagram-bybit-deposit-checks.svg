<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540"><rect width="1200" height="540" rx="28" fill="#eef1e9"/><text x="60" y="75" font-size="34" font-weight="700" fill="#293a31" font-family="sans-serif">链上入金前的四重核对</text><g font-family="sans-serif"><rect x="60" y="135" width="500" height="130" rx="18" fill="#fffdf8"/><circle cx="115" cy="200" r="30" fill="#d8e7dc"/><text x="115" y="209" text-anchor="middle" font-size="24" fill="#41634e">1</text><text x="165" y="190" font-size="26" font-weight="700" fill="#293a31">币种相同</text><text x="165" y="228" font-size="20" fill="#606b64">例如两端都选 USDT</text><rect x="640" y="135" width="500" height="130" rx="18" fill="#fffdf8"/><circle cx="695" cy="200" r="30" fill="#f1dfd2"/><text x="695" y="209" text-anchor="middle" font-size="24" fill="#8b513a">2</text><text x="745" y="190" font-size="26" font-weight="700" fill="#293a31">网路一致</text><text x="745" y="228" font-size="20" fill="#606b64">发送端 = 收款端</text><rect x="60" y="315" width="500" height="130" rx="18" fill="#fffdf8"/><circle cx="115" cy="380" r="30" fill="#f1dfd2"/><text x="115" y="389" text-anchor="middle" font-size="24" fill="#8b513a">3</text><text x="165" y="370" font-size="26" font-weight="700" fill="#293a31">地址完整</text><text x="165" y="408" font-size="20" fill="#606b64">比对首尾，勿只信剪贴簿</text><rect x="640" y="315" width="500" height="130" rx="18" fill="#fffdf8"/><circle cx="695" cy="380" r="30" fill="#d8e7dc"/><text x="695" y="389" text-anchor="middle" font-size="24" fill="#41634e">4</text><text x="745" y="370" font-size="26" font-weight="700" fill="#293a31">备注码与门槛</text><text x="745" y="408" font-size="20" fill="#606b64">需要时一并填写</text><text x="60" y="495" font-size="22" fill="#8b513a" font-family="sans-serif">首次转帐先小额测试；链上交易通常无法撤回。</text></svg>