<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540"><rect width="1200" height="540" rx="28" fill="#eef1e9"/><text x="60" y="75" font-size="34" font-weight="700" fill="#293a31" font-family="sans-serif">鏈上入金前的四重核對</text><g font-family="sans-serif"><rect x="60" y="135" width="500" height="130" rx="18" fill="#fffdf8"/><circle cx="115" cy="200" r="30" fill="#d8e7dc"/><text x="115" y="209" text-anchor="middle" font-size="24" fill="#41634e">1</text><text x="165" y="190" font-size="26" font-weight="700" fill="#293a31">幣種相同</text><text x="165" y="228" font-size="20" fill="#606b64">例如兩端都選 USDT</text><rect x="640" y="135" width="500" height="130" rx="18" fill="#fffdf8"/><circle cx="695" cy="200" r="30" fill="#f1dfd2"/><text x="695" y="209" text-anchor="middle" font-size="24" fill="#8b513a">2</text><text x="745" y="190" font-size="26" font-weight="700" fill="#293a31">網路一致</text><text x="745" y="228" font-size="20" fill="#606b64">發送端 = 收款端</text><rect x="60" y="315" width="500" height="130" rx="18" fill="#fffdf8"/><circle cx="115" cy="380" r="30" fill="#f1dfd2"/><text x="115" y="389" text-anchor="middle" font-size="24" fill="#8b513a">3</text><text x="165" y="370" font-size="26" font-weight="700" fill="#293a31">地址完整</text><text x="165" y="408" font-size="20" fill="#606b64">比對首尾，勿只信剪貼簿</text><rect x="640" y="315" width="500" height="130" rx="18" fill="#fffdf8"/><circle cx="695" cy="380" r="30" fill="#d8e7dc"/><text x="695" y="389" text-anchor="middle" font-size="24" fill="#41634e">4</text><text x="745" y="370" font-size="26" font-weight="700" fill="#293a31">備註碼與門檻</text><text x="745" y="408" font-size="20" fill="#606b64">需要時一併填寫</text><text x="60" y="495" font-size="22" fill="#8b513a" font-family="sans-serif">首次轉帳先小額測試；鏈上交易通常無法撤回。</text></svg>