<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">链上交易费用影响因素</title>
  <desc id="desc">链上费用由网络规则、交易资源消耗、拥堵需求和优先级共同影响。</desc>
  <rect width="1200" height="620" rx="36" fill="#f4f8f7"/>
  <text x="70" y="88" fill="#173b3b" font-family="Arial,sans-serif" font-size="34" font-weight="700">链上费用会被哪些因素改变</text>
  <text x="70" y="130" fill="#587070" font-family="Arial,sans-serif" font-size="20">每条网络的计费规则不同，钱包提供的是估算</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="400" y="205" width="400" height="110" rx="24" fill="#173b3b"/><text x="600" y="270" fill="#fff" font-size="25" font-weight="700">最终交易费用</text>
    <rect x="70" y="390" width="245" height="115" rx="22" fill="#fff" stroke="#a8ceca" stroke-width="3"/><text x="192" y="438" fill="#176c67" font-size="21" font-weight="700">网络规则</text><text x="192" y="473" fill="#587070" font-size="17">基础费率与单位</text>
    <rect x="355" y="390" width="245" height="115" rx="22" fill="#fff" stroke="#a8ceca" stroke-width="3"/><text x="477" y="438" fill="#176c67" font-size="21" font-weight="700">资源消耗</text><text x="477" y="473" fill="#587070" font-size="17">简单转账或合约调用</text>
    <rect x="640" y="390" width="245" height="115" rx="22" fill="#fff" stroke="#a8ceca" stroke-width="3"/><text x="762" y="438" fill="#176c67" font-size="21" font-weight="700">网络需求</text><text x="762" y="473" fill="#587070" font-size="17">拥堵时的竞争</text>
    <rect x="925" y="390" width="205" height="115" rx="22" fill="#fff" stroke="#d9bba5" stroke-width="3"/><text x="1027" y="438" fill="#8a583f" font-size="21" font-weight="700">优先级</text><text x="1027" y="473" fill="#765e50" font-size="17">用户设置</text>
  </g>
  <g fill="none" stroke="#2c9187" stroke-width="4" stroke-linecap="round"><path d="M192 378 470 325"/><path d="M477 378 560 325"/><path d="M762 378 640 325"/><path d="M1027 378 730 325"/></g>
  <text x="600" y="558" text-anchor="middle" fill="#587070" font-family="Arial,sans-serif" font-size="18">高费用不证明收款地址、代币或合约可靠。</text>
</svg>
