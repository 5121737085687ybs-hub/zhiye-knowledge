<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Bybit Perp Options到期与风险核对</title><desc id="desc">期权有明确到期日；交易前核对合约方向、履约价、到期时点、最大损失、保证金和市场流动性。</desc>
<rect width="1200" height="700" rx="28" fill="#f5f2e9"/><text x="70" y="72" fill="#597267" font-family="sans-serif" font-size="18" letter-spacing="3">知页 · 期权风险清单</text><text x="70" y="135" fill="#203d34" font-family="sans-serif" font-size="42" font-weight="700">永续标的之上，期权仍会到期</text>
<g font-family="sans-serif">
<path d="M175 275h850" stroke="#789483" stroke-width="8" stroke-linecap="round"/><path d="M1025 275l-28-20v40z" fill="#789483"/>
<circle cx="230" cy="275" r="32" fill="#e1ebe3" stroke="#315348" stroke-width="6"/><text x="230" y="283" text-anchor="middle" fill="#315348" font-size="22" font-weight="700">开仓</text>
<circle cx="600" cy="275" r="32" fill="#eee7d7" stroke="#6f6241" stroke-width="6"/><text x="600" y="283" text-anchor="middle" fill="#6f6241" font-size="22" font-weight="700">持有期</text>
<circle cx="970" cy="275" r="32" fill="#f1e2d9" stroke="#885f4b" stroke-width="6"/><text x="970" y="283" text-anchor="middle" fill="#885f4b" font-size="22" font-weight="700">到期结算</text>
<rect x="70" y="365" width="500" height="145" rx="24" fill="#e1ebe3"/><text x="105" y="415" fill="#203d34" font-size="25" font-weight="700">买方先核对</text><text x="105" y="463" fill="#496057" font-size="19">方向 · 履约价 · 权利金 · 最坏损失</text>
<rect x="630" y="365" width="500" height="145" rx="24" fill="#eee7d7"/><text x="665" y="415" fill="#203d34" font-size="25" font-weight="700">卖方另核对</text><text x="665" y="463" fill="#746c58" font-size="19">保证金 · 潜在损失 · 仓位联动 · 流动性</text>
<rect x="70" y="540" width="1060" height="74" rx="20" fill="#f1e2d9"/><text x="600" y="586" text-anchor="middle" fill="#885f4b" font-size="22" font-weight="700">底层永续合约没有固定到期日，不会取消上层期权的到期规则</text>
</g><text x="70" y="657" fill="#777a70" font-family="sans-serif" font-size="17">成交价、结算规则与账户资格以产品页面当前显示为准。</text></svg>