<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101827"/><text x="60" y="70" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">P2P 订单安全核对流程</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="65" y="150" width="235" height="128" rx="20" fill="#223550"/><text x="182" y="205" fill="#f7a600" font-size="25">① 选订单</text><text x="182" y="245" fill="#fff" font-size="20">核对条款与限额</text><rect x="355" y="150" width="235" height="128" rx="20" fill="#223550"/><text x="472" y="205" fill="#f7a600" font-size="25">② 核身份</text><text x="472" y="245" fill="#fff" font-size="20">付款人须与订单相符</text><rect x="645" y="150" width="235" height="128" rx="20" fill="#223550"/><text x="762" y="205" fill="#f7a600" font-size="25">③ 实际收款</text><text x="762" y="245" fill="#fff" font-size="20">登录银行核对入账</text><rect x="935" y="150" width="200" height="128" rx="20" fill="#223550"/><text x="1035" y="205" fill="#f7a600" font-size="25">④ 再放币</text><text x="1035" y="245" fill="#fff" font-size="20">按订单界面操作</text><g stroke="#f7a600" stroke-width="5" fill="none"><path d="M300 214h45"/><path d="M590 214h45"/><path d="M880 214h45"/></g><rect x="65" y="350" width="1070" height="200" rx="20" fill="#18263a"/><text x="100" y="405" text-anchor="start" fill="#ffcf74" font-size="24">遇到异常</text><text x="100" y="452" text-anchor="start" fill="#e5edf8" font-size="21">不要凭截图或短信放币；不要接受第三方代付；不要转到站外沟通。</text><text x="100" y="497" text-anchor="start" fill="#e5edf8" font-size="21">在订单仍有效时使用平台申诉入口，提交订单号、聊天记录和付款凭证。</text></g></svg>