<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="28" fill="#f2eee5"/><text x="56" y="68" fill="#17232e" font-family="sans-serif" font-size="30" font-weight="700">分批买入会改变成本分布，不会限制下跌</text><line x1="122" y1="370" x2="978" y2="370" stroke="#9ea49f" stroke-width="2"/><line x1="122" y1="142" x2="122" y2="370" stroke="#9ea49f" stroke-width="2"/><path d="M150 185 330 210 510 242 690 275 870 315 956 337" fill="none" stroke="#b76745" stroke-width="6"/><circle cx="260" cy="200" r="11" fill="#2c6960"/><circle cx="440" cy="230" r="11" fill="#2c6960"/><circle cx="620" cy="262" r="11" fill="#2c6960"/><circle cx="800" cy="300" r="11" fill="#2c6960"/><text x="154" y="415" fill="#455b60" font-family="sans-serif" font-size="18">每个周期按计划下单</text><line x1="150" y1="255" x2="956" y2="255" stroke="#2c6960" stroke-width="3" stroke-dasharray="10 10"/><text x="640" y="238" fill="#2c6960" font-family="sans-serif" font-size="18">示意平均成本位置</text><rect x="56" y="455" width="988" height="40" rx="12" fill="#17232e"/><text x="82" y="482" fill="#f4f0e8" font-family="sans-serif" font-size="17">示意图非回测结果；持续下跌时，分批买入仍可能亏损。</text></svg>