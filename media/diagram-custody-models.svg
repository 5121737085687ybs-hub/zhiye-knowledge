<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">数字资产保管方式比较</title><desc id="desc">托管账户、自托管软件钱包和硬件钱包分别有不同的密钥控制、便利性和恢复责任。</desc>
  <rect width="1200" height="630" rx="36" fill="#f5f2e9"/><text x="72" y="92" fill="#315348" font-family="sans-serif" font-size="22" letter-spacing="4">CUSTODY · CONTROL &amp; RECOVERY</text><text x="72" y="158" fill="#203d34" font-family="sans-serif" font-size="46" font-weight="700">谁掌握密钥，谁承担恢复责任</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="74" y="222" width="340" height="226" rx="24" fill="#e1ebe3"/><text x="244" y="274" fill="#315348" font-size="22">托管账户</text><text x="244" y="327" fill="#263d35" font-size="25" font-weight="700">服务方管理访问</text><text x="244" y="367" fill="#65746d" font-size="18">账户恢复 · 提款规则</text><text x="244" y="405" fill="#65746d" font-size="18">关注服务商与托管安排</text>
  <rect x="430" y="222" width="340" height="226" rx="24" fill="#eee7d7"/><text x="600" y="274" fill="#846a27" font-size="22">软件钱包</text><text x="600" y="327" fill="#403e35" font-size="25" font-weight="700">用户管理签名密钥</text><text x="600" y="367" fill="#746c58" font-size="18">随身可用 · 设备安全</text><text x="600" y="405" fill="#746c58" font-size="18">恢复信息必须自行保护</text>
  <rect x="786" y="222" width="340" height="226" rx="24" fill="#e1ebe3"/><text x="956" y="274" fill="#315348" font-size="22">硬件 / 多重签名</text><text x="956" y="327" fill="#263d35" font-size="25" font-weight="700">分隔授权或签名</text><text x="956" y="367" fill="#65746d" font-size="18">增加隔离，也增加设置</text><text x="956" y="405" fill="#65746d" font-size="18">恢复流程仍需提前设计</text></g>
  <text x="72" y="520" fill="#43584f" font-family="sans-serif" font-size="21">便利、控制权和恢复责任，需要按自己的能力一起权衡。</text><text x="72" y="575" fill="#839087" font-family="sans-serif" font-size="16">知页 · 一般安全教育</text>
</svg>
