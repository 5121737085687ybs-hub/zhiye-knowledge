<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Telegram 隐私和账号安全设置清单</title><desc id="desc">用两步验证、应用锁、号码隐私和活跃设备检查保护账号。</desc>
<rect width="1200" height="620" rx="30" fill="#f5f2e9"/><text x="58" y="70" fill="#597267" font-family="sans-serif" font-size="19" letter-spacing="3">PRIVACY CHECKLIST</text><text x="58" y="125" fill="#203d34" font-family="sans-serif" font-size="38" font-weight="700">先把账号的四道门关好</text>
<g font-family="sans-serif">
<rect x="58" y="174" width="518" height="160" rx="22" fill="#e1ebe3"/><circle cx="119" cy="234" r="28" fill="#315348"/><path d="M108 234l8 8 15-18" fill="none" stroke="#fffdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="166" y="225" fill="#263d35" font-size="25" font-weight="700">两步验证</text><text x="166" y="263" fill="#62746a" font-size="18">登录码之外再设置独立密码，</text><text x="166" y="291" fill="#62746a" font-size="18">妥善保护恢复邮箱。</text>
<rect x="624" y="174" width="518" height="160" rx="22" fill="#eee7d7"/><circle cx="685" cy="234" r="28" fill="#846a27"/><path d="M674 234v-9a11 11 0 0 1 22 0v9M671 234h28v22h-28z" fill="none" stroke="#fffdf8" stroke-width="4"/><text x="732" y="225" fill="#403e35" font-size="25" font-weight="700">应用锁与设备检查</text><text x="732" y="263" fill="#746c58" font-size="18">设置本机密码或生物识别，</text><text x="732" y="291" fill="#746c58" font-size="18">定期结束不认识的活跃会话。</text>
<rect x="58" y="363" width="518" height="160" rx="22" fill="#f1e2d9"/><circle cx="119" cy="423" r="28" fill="#a36f55"/><path d="M104 423h30M119 408v30" stroke="#fffdf8" stroke-width="4" stroke-linecap="round"/><text x="166" y="414" fill="#554237" font-size="25" font-weight="700">号码与公开用户名</text><text x="166" y="452" fill="#826b5d" font-size="18">按需要限制号码可见范围；</text><text x="166" y="480" fill="#826b5d" font-size="18">用户名避免包含敏感个人信息。</text>
<rect x="624" y="363" width="518" height="160" rx="22" fill="#e1ebe3"/><circle cx="685" cy="423" r="28" fill="#315348"/><path d="M673 414h24v18h-24zM678 409v-7M692 409v-7M679 439v7M691 439v7" fill="none" stroke="#fffdf8" stroke-width="4" stroke-linecap="round"/><text x="732" y="414" fill="#263d35" font-size="25" font-weight="700">群组、来电与转发隐私</text><text x="732" y="452" fill="#62746a" font-size="18">检查谁能邀请你、联系你或查看资料；</text><text x="732" y="480" fill="#62746a" font-size="18">按实际需要调整可用选项。</text>
</g>
<text x="58" y="570" fill="#53645b" font-family="sans-serif" font-size="17">不要把验证码、两步验证密码或恢复邮箱代码发给“客服”或群管理员。</text>
</svg>
