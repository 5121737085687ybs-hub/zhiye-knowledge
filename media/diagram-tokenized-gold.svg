<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">黄金代币的权利与流程</title><desc id="desc">发行文件、黄金托管、链上代币和赎回路径共同决定黄金代币代表的权益。</desc>
  <rect width="1200" height="630" rx="36" fill="#f5f2e9"/><text x="72" y="92" fill="#315348" font-family="sans-serif" font-size="22" letter-spacing="4">TOKENISED GOLD · RIGHTS &amp; CUSTODY</text>
  <text x="72" y="158" fill="#203d34" font-family="sans-serif" font-size="46" font-weight="700">代币 ≠ 自动取得金条所有权</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="70" y="242" width="230" height="180" rx="24" fill="#fffdf7" stroke="#c8b573" stroke-width="3"/><text x="185" y="302" fill="#846a27" font-size="22">01 · 法律文件</text><text x="185" y="354" fill="#263d35" font-size="25">代币代表什么权利</text><text x="185" y="391" fill="#65746d" font-size="17">所有权 / 债权 / 合约权益</text>
  <rect x="352" y="242" width="230" height="180" rx="24" fill="#fffdf7" stroke="#c8b573" stroke-width="3"/><text x="467" y="302" fill="#846a27" font-size="22">02 · 实物托管</text><text x="467" y="354" fill="#263d35" font-size="25">黄金由谁保管</text><text x="467" y="391" fill="#65746d" font-size="17">盘点 / 保险 / 违约责任</text>
  <rect x="634" y="242" width="230" height="180" rx="24" fill="#fffdf7" stroke="#83a494" stroke-width="3"/><text x="749" y="302" fill="#315348" font-size="22">03 · 链上记录</text><text x="749" y="354" fill="#263d35" font-size="25">发行与转移</text><text x="749" y="391" fill="#65746d" font-size="17">网络 / 合约 / 流动性</text>
  <rect x="916" y="242" width="230" height="180" rx="24" fill="#fffdf7" stroke="#c8b573" stroke-width="3"/><text x="1031" y="302" fill="#846a27" font-size="22">04 · 赎回安排</text><text x="1031" y="354" fill="#263d35" font-size="25">是否可以兑付</text><text x="1031" y="391" fill="#65746d" font-size="17">资格 / 门槛 / 费用 / 暂停</text></g>
  <g stroke="#82948b" stroke-width="4" fill="none"><path d="M304 332h38"/><path d="M586 332h38"/><path d="M868 332h38"/></g><g fill="#82948b"><path d="m337 324 12 8-12 8z"/><path d="m619 324 12 8-12 8z"/><path d="m901 324 12 8-12 8z"/></g>
  <text x="72" y="520" fill="#43584f" font-family="sans-serif" font-size="22">逐项核对权利、储备、赎回和合约；“上链”只说明记录方式。</text><text x="72" y="573" fill="#839087" font-family="sans-serif" font-size="16">知页 · 一般知识分享</text>
</svg>
