<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Bybit标准子账户创建和资金流向</title><desc id="desc">从主账户创建标准子账户，通过主账户划转资金，分别交易并由主账户负责外部出入金。</desc>
<rect width="1200" height="700" rx="28" fill="#f5f2e9"/><text x="70" y="72" fill="#597267" font-family="sans-serif" font-size="18" letter-spacing="3">知页 · 操作流程图</text><text x="70" y="135" fill="#203d34" font-family="sans-serif" font-size="42" font-weight="700">先弄清账户之间能做什么</text>
<g font-family="sans-serif">
<rect x="70" y="220" width="280" height="180" rx="24" fill="#315348"/><text x="210" y="282" fill="#fffdf8" font-size="27" font-weight="700" text-anchor="middle">主账户</text><text x="210" y="326" fill="#e1ebe3" font-size="19" text-anchor="middle">创建并管理子账户</text><text x="210" y="360" fill="#e1ebe3" font-size="18" text-anchor="middle">负责链上出入金</text>
<rect x="460" y="220" width="280" height="180" rx="24" fill="#fffdf8" stroke="#789483" stroke-width="3"/><text x="600" y="282" fill="#315348" font-size="27" font-weight="700" text-anchor="middle">标准子账户</text><text x="600" y="326" fill="#496057" font-size="19" text-anchor="middle">单独管理交易与盈亏</text><text x="600" y="360" fill="#496057" font-size="18" text-anchor="middle">不能自行链上出入金</text>
<rect x="850" y="220" width="280" height="180" rx="24" fill="#eee7d7"/><text x="990" y="282" fill="#6f6241" font-size="27" font-weight="700" text-anchor="middle">账户切换</text><text x="990" y="326" fill="#746c58" font-size="19" text-anchor="middle">从主账户切换访问</text><text x="990" y="360" fill="#746c58" font-size="18" text-anchor="middle">权限与登录设置可核对</text>
</g><path d="M350 278h110" stroke="#c7794b" stroke-width="5"/><path d="m445 264 16 14-16 14" fill="none" stroke="#c7794b" stroke-width="5"/><path d="M460 348H350" stroke="#789483" stroke-width="5"/><path d="m365 334-16 14 16 14" fill="none" stroke="#789483" stroke-width="5"/>
<rect x="70" y="470" width="1060" height="112" rx="22" fill="#f1e2d9"/><text x="110" y="515" fill="#885f4b" font-family="sans-serif" font-size="23" font-weight="700">重要边界</text><text x="110" y="552" fill="#704f40" font-family="sans-serif" font-size="20">盈亏分开记录 ≠ 互不承担市场风险；主账户安全、权限和资金管理仍然关键。</text><text x="70" y="638" fill="#777a70" font-family="sans-serif" font-size="17">功能名称与可用性可能变化，请以 Bybit 当前账户页面为准。</text></svg>
