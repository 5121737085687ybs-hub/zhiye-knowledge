<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="28" fill="#eef1e9"/><text x="60" y="75" font-size="34" font-weight="700" fill="#293a31" font-family="sans-serif">開倉前，回答五個問題</text><g font-family="sans-serif"><rect x="55" y="135" width="340" height="125" rx="18" fill="#fffdf8"/><text x="85" y="185" font-size="25" font-weight="700" fill="#293a31">1. 最大可承受損失？</text><text x="85" y="225" font-size="20" fill="#606b64">先定風險額，再推倉位大小</text><rect x="430" y="135" width="340" height="125" rx="18" fill="#fffdf8"/><text x="460" y="185" font-size="25" font-weight="700" fill="#293a31">2. 保證金模式？</text><text x="460" y="225" font-size="20" fill="#606b64">了解共用抵押品的影響</text><rect x="805" y="135" width="340" height="125" rx="18" fill="#fffdf8"/><text x="835" y="185" font-size="25" font-weight="700" fill="#293a31">3. 強平參考價？</text><text x="835" y="225" font-size="20" fill="#606b64">強平條件依模式與規則而異</text><rect x="240" y="305" width="340" height="125" rx="18" fill="#fffdf8"/><text x="270" y="355" font-size="25" font-weight="700" fill="#293a31">4. 持倉成本？</text><text x="270" y="395" font-size="20" fill="#606b64">手續費、資金費用、利息</text><rect x="620" y="305" width="340" height="125" rx="18" fill="#fffdf8"/><text x="650" y="355" font-size="25" font-weight="700" fill="#293a31">5. 退出條件？</text><text x="650" y="395" font-size="20" fill="#606b64">規劃止損與平倉方式</text></g><text x="60" y="485" font-size="21" fill="#8b513a" font-family="sans-serif">高槓桿下，小幅反向波動也可能造成重大損失或強制平倉。</text></svg>