<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="28" fill="#eef1e9"/><text x="60" y="75" font-size="34" font-weight="700" fill="#293a31" font-family="sans-serif">开仓前，回答五个问题</text><g font-family="sans-serif"><rect x="55" y="135" width="340" height="125" rx="18" fill="#fffdf8"/><text x="85" y="185" font-size="25" font-weight="700" fill="#293a31">1. 最大可承受损失？</text><text x="85" y="225" font-size="20" fill="#606b64">先定风险额，再推仓位大小</text><rect x="430" y="135" width="340" height="125" rx="18" fill="#fffdf8"/><text x="460" y="185" font-size="25" font-weight="700" fill="#293a31">2. 保证金模式？</text><text x="460" y="225" font-size="20" fill="#606b64">了解共用抵押品的影响</text><rect x="805" y="135" width="340" height="125" rx="18" fill="#fffdf8"/><text x="835" y="185" font-size="25" font-weight="700" fill="#293a31">3. 强平参考价？</text><text x="835" y="225" font-size="20" fill="#606b64">强平条件依模式与规则而异</text><rect x="240" y="305" width="340" height="125" rx="18" fill="#fffdf8"/><text x="270" y="355" font-size="25" font-weight="700" fill="#293a31">4. 持仓成本？</text><text x="270" y="395" font-size="20" fill="#606b64">手续费、资金费用、利息</text><rect x="620" y="305" width="340" height="125" rx="18" fill="#fffdf8"/><text x="650" y="355" font-size="25" font-weight="700" fill="#293a31">5. 退出条件？</text><text x="650" y="395" font-size="20" fill="#606b64">规划止损与平仓方式</text></g><text x="60" y="485" font-size="21" fill="#8b513a" font-family="sans-serif">高杠杆下，小幅反向波动也可能造成重大损失或强制平仓。</text></svg>