<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">期权合约乘数示意</title><desc id="desc">标准美股期权通常乘数 100 股，Bybit Perp Options 乘数 1 且最小订单规则仍需核对。</desc>
<rect width="1200" height="650" rx="30" fill="#f5f2e9"/><text x="58" y="70" fill="#597267" font-family="sans-serif" font-size="19" letter-spacing="3">CONTRACT MULTIPLIER</text><text x="58" y="126" fill="#203d34" font-family="sans-serif" font-size="38" font-weight="700">乘数缩小单张规模，不会消除期权风险</text>
<g font-family="sans-serif"><rect x="70" y="180" width="490" height="280" rx="28" fill="#eee7d7"/><text x="108" y="232" fill="#6f6241" font-size="25" font-weight="700">传统标准美股个股期权</text><text x="110" y="290" fill="#746c58" font-size="20">合约乘数通常为 100 股</text>
<g transform="translate(112 328)" fill="#cbbd9f"><rect width="66" height="66" rx="16"/><rect x="80" width="66" height="66" rx="16"/><rect x="160" width="66" height="66" rx="16"/><rect x="240" width="66" height="66" rx="16"/><rect x="320" width="66" height="66" rx="16"/></g><text x="113" y="424" fill="#6f6241" font-size="17">图中每个方块仅示意一组 20 股</text>
<rect x="640" y="180" width="490" height="280" rx="28" fill="#e1ebe3"/><text x="678" y="232" fill="#315348" font-size="25" font-weight="700">Bybit Perp Options</text><text x="680" y="290" fill="#53645b" font-size="20">合约乘数为 1</text><g transform="translate(682 332)"><rect width="100" height="72" rx="18" fill="#789483"/><text x="50" y="48" fill="#fffdf8" font-size="32" font-weight="700" text-anchor="middle">1</text></g><text x="800" y="372" fill="#53645b" font-size="19">一张合约的参考单位</text><text x="800" y="407" fill="#885f4b" font-size="17">最低下单张数看官方规则</text>
</g><rect x="70" y="498" width="1060" height="86" rx="22" fill="#fffdf8"/><text x="104" y="535" fill="#203d34" font-family="sans-serif" font-size="20" font-weight="700">示例仅用于说明乘数差异</text><text x="104" y="566" fill="#53645b" font-family="sans-serif" font-size="17">权利金、报价、费用与产品并不完全相同；单张规模较小不等于总成本更低或风险更小。</text></svg>
