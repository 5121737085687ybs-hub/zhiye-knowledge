<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="24" fill="#101827"/><text x="60" y="78" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">注册邀请码四步核对</text><g font-family="Arial,sans-serif"><rect x="55" y="165" width="250" height="300" rx="22" fill="#1b2a3d"/><circle cx="180" cy="225" r="34" fill="#c5ff2f"/><text x="180" y="236" text-anchor="middle" fill="#101827" font-size="28" font-weight="700">1</text><text x="180" y="305" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">确认地区</text><text x="180" y="355" text-anchor="middle" fill="#aab6c6" font-size="19">居住地与条款</text><text x="180" y="385" text-anchor="middle" fill="#aab6c6" font-size="19">符合开放资格</text><rect x="345" y="165" width="250" height="300" rx="22" fill="#1b2a3d"/><circle cx="470" cy="225" r="34" fill="#c5ff2f"/><text x="470" y="236" text-anchor="middle" fill="#101827" font-size="28" font-weight="700">2</text><text x="470" y="305" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">核验链接</text><text x="470" y="355" text-anchor="middle" fill="#aab6c6" font-size="19">官方域名与活动</text><text x="470" y="385" text-anchor="middle" fill="#aab6c6" font-size="19">确认码已关联</text><rect x="635" y="165" width="250" height="300" rx="22" fill="#1b2a3d"/><circle cx="760" cy="225" r="34" fill="#c5ff2f"/><text x="760" y="236" text-anchor="middle" fill="#101827" font-size="28" font-weight="700">3</text><text x="760" y="305" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">阅读规则</text><text x="760" y="355" text-anchor="middle" fill="#aab6c6" font-size="19">认证、费用、活动</text><text x="760" y="385" text-anchor="middle" fill="#aab6c6" font-size="19">无固定奖励保证</text><rect x="925" y="165" width="220" height="300" rx="22" fill="#1b2a3d"/><circle cx="1035" cy="225" r="34" fill="#c5ff2f"/><text x="1035" y="236" text-anchor="middle" fill="#101827" font-size="28" font-weight="700">4</text><text x="1035" y="305" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">保护账户</text><text x="1035" y="355" text-anchor="middle" fill="#aab6c6" font-size="19">本人资料注册</text><text x="1035" y="385" text-anchor="middle" fill="#aab6c6" font-size="19">启用双重验证</text></g><text x="60" y="550" fill="#c5ff2f" font-family="Arial,sans-serif" font-size="22">不绕过地区限制 · 不为奖励盲目入金或交易</text></svg>
