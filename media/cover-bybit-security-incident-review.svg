<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Bybit安全事件复盘封面</title><desc id="desc">以事件、储备证明、风险控制披露和用户核验四条线索评估交易平台的安全信息。</desc>
<rect width="1200" height="630" rx="34" fill="#f5f2e9"/><circle cx="960" cy="315" r="250" fill="#e1ebe3"/><circle cx="960" cy="315" r="170" fill="#d4e0d6"/>
<text x="72" y="82" fill="#597267" font-family="sans-serif" font-size="20" letter-spacing="4">知页 · 平台风险</text>
<text x="72" y="185" fill="#203d34" font-family="sans-serif" font-size="52" font-weight="700">读懂安全信息的边界</text>
<text x="74" y="245" fill="#496057" font-family="sans-serif" font-size="29">Bybit冷钱包事件与风险核对</text>
