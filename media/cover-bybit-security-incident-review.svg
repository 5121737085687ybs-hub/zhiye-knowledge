<rect x="72" y="390" width="205" height="64" rx="18" fill="#e1ebe3"/><text x="174" y="430" text-anchor="middle" fill="#315348" font-family="sans-serif" font-size="22" font-weight="700">分清事件与影响</text>
<rect x="298" y="390" width="205" height="64" rx="18" fill="#eee7d7"/><text x="400" y="430" text-anchor="middle" fill="#6f6241" font-family="sans-serif" font-size="22" font-weight="700">理解储备范围</text>
<rect x="524" y="390" width="205" height="64" rx="18" fill="#f1e2d9"/><text x="626" y="430" text-anchor="middle" fill="#885f4b" font-family="sans-serif" font-size="22" font-weight="700">持续核对风险</text>
<text x="72" y="558" fill="#777a70" font-family="sans-serif" font-size="17" letter-spacing="2">安全报告提供线索，不是未来表现或资产安全保证</text></svg>