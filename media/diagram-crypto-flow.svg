<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">一笔链上转账的四个环节</title>
  <desc id="desc">核对资产与网络、钱包签署交易、网络校验交易、区块链记录新状态。</desc>
  <rect width="1200" height="720" rx="18" fill="#f1f0e8"/>
  <text x="68" y="86" fill="#20241f" font-family="'Songti SC','Noto Serif CJK SC',serif" font-size="48">一笔链上转账，经过四个环节</text>
  <text x="70" y="126" fill="#777a70" font-family="Arial,sans-serif" font-size="21" letter-spacing="2">先核对，再签名；确认后，共享账本更新状态</text>
  <path d="M175 315H1022" stroke="#b7bdab" stroke-width="4" stroke-dasharray="8 12"/>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <g transform="translate(70 190)">
      <rect width="235" height="350" rx="8" fill="#fffefa"/>
      <circle cx="117" cy="108" r="54" fill="#e4e9dc"/>
      <text x="117" y="121" fill="#536b48" font-size="39" font-weight="600">01</text>
      <text x="117" y="220" fill="#20241f" font-size="32" font-weight="600">核对信息</text>
      <text x="117" y="270" fill="#777a70" font-size="23">资产 · 网络</text>
      <text x="117" y="309" fill="#777a70" font-size="23">收款地址</text>
    </g>
    <g transform="translate(365 190)">
      <rect width="235" height="350" rx="8" fill="#fffefa"/>
      <circle cx="117" cy="108" r="54" fill="#f1e4d8"/>
      <text x="117" y="121" fill="#c7794b" font-size="39" font-weight="600">02</text>
      <text x="117" y="220" fill="#20241f" font-size="32" font-weight="600">钱包签名</text>
      <text x="117" y="270" fill="#777a70" font-size="23">用密钥证明</text>
      <text x="117" y="309" fill="#777a70" font-size="23">你授权了操作</text>
    </g>
    <g transform="translate(660 190)">
      <rect width="235" height="350" rx="8" fill="#fffefa"/>
      <circle cx="117" cy="108" r="54" fill="#e4e9dc"/>
      <text x="117" y="121" fill="#536b48" font-size="39" font-weight="600">03</text>
      <text x="117" y="220" fill="#20241f" font-size="32" font-weight="600">网络校验</text>
      <text x="117" y="270" fill="#777a70" font-size="23">参与者检查</text>
      <text x="117" y="309" fill="#777a70" font-size="23">交易是否有效</text>
    </g>
    <g transform="translate(955 190)">
      <rect width="175" height="350" rx="8" fill="#30452f"/>
      <circle cx="87" cy="108" r="54" fill="#52684a"/>
      <text x="87" y="121" fill="#e2e99e" font-size="39" font-weight="600">04</text>
      <text x="87" y="220" fill="#fffefa" font-size="29" font-weight="600">记录状态</text>
      <text x="87" y="270" fill="#d2d8c7" font-size="22">共享账本</text>
      <text x="87" y="309" fill="#d2d8c7" font-size="22">出现新记录</text>
    </g>
  </g>
  <g fill="#d48152"><path d="m334 315-18-12v24z"/><path d="m629 315-18-12v24z"/><path d="m924 315-18-12v24z"/></g>
  <text x="70" y="632" fill="#85877d" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">知页 · 区块链入门</text>
  <text x="1128" y="632" text-anchor="end" fill="#85877d" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">LEARN BEFORE YOU SIGN</text>
</svg>
