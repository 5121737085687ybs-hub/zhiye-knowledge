<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">新加坡数字资产服务核对步骤</title><desc id="desc">先查法律实体，再在MAS名录查看业务类型、许可状态和官方联系方式。</desc>
  <rect width="1200" height="630" rx="36" fill="#f3f4ef"/><text x="72" y="92" fill="#315348" font-family="sans-serif" font-size="22" letter-spacing="4">SINGAPORE · CHECK THE SERVICE ENTITY</text><text x="72" y="158" fill="#203d34" font-family="sans-serif" font-size="46" font-weight="700">从法律实体开始核对</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="76" y="238" width="240" height="164" rx="24" fill="#e1ebe3"/><text x="196" y="290" fill="#315348" font-size="21">01 · 确认主体</text><text x="196" y="342" fill="#263d35" font-size="24" font-weight="700">完整法律名称</text><text x="196" y="376" fill="#65746d" font-size="17">不要只看品牌</text>
  <rect x="356" y="238" width="240" height="164" rx="24" fill="#eee7d7"/><text x="476" y="290" fill="#846a27" font-size="21">02 · 查业务</text><text x="476" y="342" fill="#403e35" font-size="24" font-weight="700">许可活动</text><text x="476" y="376" fill="#746c58" font-size="17">确认服务范围</text>
  <rect x="636" y="238" width="240" height="164" rx="24" fill="#e1ebe3"/><text x="756" y="290" fill="#315348" font-size="21">03 · 核对状态</text><text x="756" y="342" fill="#263d35" font-size="24" font-weight="700">当前名录</text><text x="756" y="376" fill="#65746d" font-size="17">以最新记录为准</text>
  <rect x="916" y="238" width="240" height="164" rx="24" fill="#eee7d7"/><text x="1036" y="290" fill="#846a27" font-size="21">04 · 官方联系</text><text x="1036" y="342" fill="#403e35" font-size="24" font-weight="700">独立访问官网</text><text x="1036" y="376" fill="#746c58" font-size="17">防范冒名客服</text></g>
  <g stroke="#82948b" stroke-width="4"><path d="M316 320h40"/><path d="M596 320h40"/><path d="M876 320h40"/></g><g fill="#82948b"><path d="m345 312 12 8-12 8z"/><path d="m625 312 12 8-12 8z"/><path d="m905 312 12 8-12 8z"/></g>
  <text x="72" y="505" fill="#43584f" font-family="sans-serif" font-size="21">监管名录用于核实业务信息，不是收益、安全或存款保险保证。</text><text x="72" y="564" fill="#839087" font-family="sans-serif" font-size="16">知页 · 一般信息整理</text>
</svg>
