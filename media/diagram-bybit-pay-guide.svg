<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="28" fill="#f2eee5"/><text x="56" y="68" fill="#17232e" font-family="sans-serif" font-size="30" font-weight="700">点确认前的付款核验顺序</text><rect x="62" y="142" width="215" height="175" rx="20" fill="#d8e5dc"/><text x="91" y="192" fill="#17232e" font-family="sans-serif" font-size="23" font-weight="700">1 · 收款方</text><text x="91" y="238" fill="#455b60" font-family="sans-serif" font-size="19">核对商户身份</text><text x="91" y="274" fill="#455b60" font-family="sans-serif" font-size="19">检查二维码有效</text><path d="M290 230h54" stroke="#d28a46" stroke-width="7"/><path d="m329 208 22 22-22 22" fill="none" stroke="#d28a46" stroke-width="7"/><rect x="360" y="142" width="215" height="175" rx="20" fill="#e8ddc8"/><text x="389" y="192" fill="#17232e" font-family="sans-serif" font-size="23" font-weight="700">2 · 币种金额</text><text x="389" y="238" fill="#455b60" font-family="sans-serif" font-size="19">核实扣款资产</text><text x="389" y="274" fill="#455b60" font-family="sans-serif" font-size="19">确认支付数额</text><path d="M588 230h54" stroke="#d28a46" stroke-width="7"/><path d="m627 208 22 22-22 22" fill="none" stroke="#d28a46" stroke-width="7"/><rect x="658" y="142" width="215" height="175" rx="20" fill="#dce1eb"/><text x="687" y="192" fill="#17232e" font-family="sans-serif" font-size="23" font-weight="700">3 · 转换成本</text><text x="687" y="238" fill="#455b60" font-family="sans-serif" font-size="19">查看汇率与费用</text><text x="687" y="274" fill="#455b60" font-family="sans-serif" font-size="19">确认最终扣款额</text><path d="M886 230h54" stroke="#d28a46" stroke-width="7"/><path d="m925 208 22 22-22 22" fill="none" stroke="#d28a46" stroke-width="7"/><rect x="956" y="142" width="94" height="175" rx="20" fill="#e7cfbf"/><text x="969" y="205" fill="#17232e" font-family="sans-serif" font-size="19" font-weight="700">4</text><text x="964" y="245" fill="#455b60" font-family="sans-serif" font-size="17">确认</text><text x="963" y="275" fill="#455b60" font-family="sans-serif" font-size="17">再付款</text><rect x="62" y="390" width="988" height="58" rx="15" fill="#17232e"/><text x="92" y="427" fill="#f4f0e8" font-family="sans-serif" font-size="20">地区、商户和功能资格各自核实；不同通道可能另有费用。</text></svg>