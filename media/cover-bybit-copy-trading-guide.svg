<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111d37"/><stop offset="1" stop-color="#344b78"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="86" y="116" fill="#f7a928" font-size="24" font-weight="700" letter-spacing="5">BYBIT • COPY TRADING</text><text x="86" y="230" fill="#fff" font-size="57" font-weight="700">跟单交易如何运作？</text><text x="90" y="294" fill="#c1cee2" font-size="28">复制信号，不等于复制结果</text><rect x="86" y="365" width="300" height="62" rx="31" fill="#70d6b5"/><text x="236" y="406" text-anchor="middle" fill="#17243b" font-size="22" font-weight="700">先看风险与设置</text><text x="86" y="547" fill="#a9b8d1" font-size="20">历史表现不能保证未来回报；跟单也可能发生亏损。</text></g><rect x="647" y="126" width="458" height="390" rx="24" fill="#192844" stroke="#60749b" stroke-width="4"/><g font-family="Arial,sans-serif"><rect x="696" y="174" width="356" height="92" rx="16" fill="#263958"/><circle cx="742" cy="220" r="23" fill="#f7a928"/><path d="M733 220h18m-9-9v18" stroke="#17243b" stroke-width="4" stroke-linecap="round"/><text x="784" y="213" fill="#fff" font-size="23" font-weight="700">交易达人发出委托</text><text x="784" y="242" fill="#c1cee2" font-size="16">策略与风险由达人决定</text><path d="M874 274v42" stroke="#70d6b5" stroke-width="5"/><path d="m863 304 11 12 11-12" fill="none" stroke="#70d6b5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="696" y="326" width="356" height="118" rx="16" fill="#263958"/><circle cx="742" cy="367" r="23" fill="#70d6b5"/><path d="M730 367h24M742 355v24" stroke="#17243b" stroke-width="4" stroke-linecap="round"/><text x="784" y="360" fill="#fff" font-size="23" font-weight="700">跟单者按自己的设置</text><text x="784" y="391" fill="#c1cee2" font-size="16">资金、模式、杠杆与限制</text><text x="874" y="427" text-anchor="middle" fill="#f7a928" font-size="17">成交价格与结果可能不同</text></g></svg>