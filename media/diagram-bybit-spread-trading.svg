<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="28" fill="#f2eee5"/><text x="56" y="68" fill="#17232e" font-family="sans-serif" font-size="30" font-weight="700">价差单执行之后，风险并没有结束</text><rect x="60" y="125" width="280" height="130" rx="20" fill="#d8e5dc"/><text x="92" y="177" fill="#17232e" font-family="sans-serif" font-size="24">1 · 选择组合</text><text x="92" y="219" fill="#455b60" font-family="sans-serif" font-size="19">现货 / 永续 / 交割合约</text><path d="M360 190h78" stroke="#d28a46" stroke-width="7"/><path d="m423 169 22 21-22 21" fill="none" stroke="#d28a46" stroke-width="7"/><rect x="460" y="125" width="280" height="130" rx="20" fill="#e8ddc8"/><text x="492" y="177" fill="#17232e" font-family="sans-serif" font-size="24">2 · 配对成交</text><text x="492" y="219" fill="#455b60" font-family="sans-serif" font-size="19">数量匹配，不代表无亏损</text><path d="M760 190h78" stroke="#d28a46" stroke-width="7"/><path d="m823 169 22 21-22 21" fill="none" stroke="#d28a46" stroke-width="7"/><rect x="860" y="125" width="180" height="130" rx="20" fill="#f0d8c8"/><text x="880" y="177" fill="#17232e" font-family="sans-serif" font-size="24">3 · 持仓管理</text><text x="880" y="219" fill="#455b60" font-family="sans-serif" font-size="18">保证金 / 费用</text><line x1="60" y1="315" x2="1040" y2="315" stroke="#c9c2b6" stroke-width="2"/><text x="70" y="382" fill="#17232e" font-family="sans-serif" font-size="22">同时检查：</text><text x="260" y="382" fill="#455b60" font-family="sans-serif" font-size="22">手续费</text><text x="430" y="382" fill="#455b60" font-family="sans-serif" font-size="22">资金费率</text><text x="635" y="382" fill="#455b60" font-family="sans-serif" font-size="22">到期差异</text><text x="830" y="382" fill="#455b60" font-family="sans-serif" font-size="22">账户强平</text><rect x="60" y="425" width="980" height="48" rx="14" fill="#17232e"/><text x="86" y="457" fill="#f4f0e8" font-family="sans-serif" font-size="19">原子式组合下单只处理入场配对，不会替你平仓或保证盈利。</text></svg>