<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="28" fill="#f2eee5"/><text x="56" y="68" fill="#17232e" font-family="sans-serif" font-size="30" font-weight="700">VIP 不是单看一个数字：资格与权益分开核验</text><rect x="64" y="140" width="286" height="245" rx="20" fill="#d8e5dc"/><text x="94" y="190" fill="#17232e" font-family="sans-serif" font-size="23" font-weight="700">资格指标</text><text x="94" y="238" fill="#455b60" font-family="sans-serif" font-size="19">账户资产余额</text><text x="94" y="275" fill="#455b60" font-family="sans-serif" font-size="19">近 30 天交易量</text><text x="94" y="312" fill="#455b60" font-family="sans-serif" font-size="19">净借款等条件</text><text x="94" y="354" fill="#455b60" font-family="sans-serif" font-size="17">各指标门槛可能调整</text><path d="M368 260h70" stroke="#d28a46" stroke-width="7"/><path d="m423 238 22 22-22 22" fill="none" stroke="#d28a46" stroke-width="7"/><rect x="460" y="140" width="260" height="245" rx="20" fill="#e8ddc8"/><text x="490" y="190" fill="#17232e" font-family="sans-serif" font-size="23" font-weight="700">可见权益</text><text x="490" y="238" fill="#455b60" font-family="sans-serif" font-size="19">费率与服务支持</text><text x="490" y="275" fill="#455b60" font-family="sans-serif" font-size="19">入金 / 提币限额</text><text x="490" y="312" fill="#455b60" font-family="sans-serif" font-size="19">活动或卡片权益</text><text x="490" y="354" fill="#455b60" font-family="sans-serif" font-size="17">依产品与地区而异</text><path d="M738 260h70" stroke="#d28a46" stroke-width="7"/><path d="m793 238 22 22-22 22" fill="none" stroke="#d28a46" stroke-width="7"/><rect x="830" y="140" width="206" height="245" rx="20" fill="#e7cfbf"/><text x="858" y="190" fill="#17232e" font-family="sans-serif" font-size="23" font-weight="700">最后确认</text><text x="858" y="240" fill="#455b60" font-family="sans-serif" font-size="18">My Fee Rate</text><text x="858" y="275" fill="#455b60" font-family="sans-serif" font-size="18">账户 VIP 页面</text><text x="858" y="310" fill="#455b60" font-family="sans-serif" font-size="18">适用条款</text><rect x="64" y="425" width="972" height="48" rx="14" fill="#17232e"/><text x="88" y="457" fill="#f4f0e8" font-family="sans-serif" font-size="18">切勿为追求等级而交易或借款；费用优惠无法抵消市场损失。</text></svg>