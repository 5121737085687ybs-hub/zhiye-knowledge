<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f2efe7"/><rect x="70" y="70" width="1060" height="580" rx="34" fill="#fffdf8" stroke="#d7d2c7" stroke-width="3"/><circle cx="970" cy="230" r="135" fill="#dce8df"/><path d="M970 145v150m-55-55 55 55 55-55" fill="none" stroke="#577463" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><text x="125" y="175" font-size="30" fill="#577463" font-family="sans-serif">BYBIT · 入金安全</text><text x="125" y="270" font-size="61" font-weight="700" fill="#26372e" font-family="sans-serif">转帐前先核对网路</text><text x="125" y="345" font-size="32" fill="#59655e" font-family="sans-serif">币种、链、地址，三项必须一致</text><rect x="125" y="415" width="690" height="135" rx="20" fill="#f4e6dc"/><text x="160" y="465" font-size="25" fill="#8b513a" font-family="sans-serif">不同网路上的同名代币不一定互通</text><text x="160" y="510" font-size="24" fill="#59655e" font-family="sans-serif">先看平台支援清单与最低入金要求</text></svg>