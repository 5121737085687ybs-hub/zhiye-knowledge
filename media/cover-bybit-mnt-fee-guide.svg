<text x="72" y="82" fill="#597267" font-family="sans-serif" font-size="20" letter-spacing="4">知页 · 交易费用</text>
<text x="72" y="185" fill="#203d34" font-family="sans-serif" font-size="52" font-weight="700">先算折扣，再看成本</text>
<text x="74" y="245" fill="#496057" font-family="sans-serif" font-size="29">Bybit MNT手续费抵扣说明</text>
