<rect x="72" y="390" width="205" height="64" rx="18" fill="#e1ebe3"/><text x="174" y="430" text-anchor="middle" fill="#315348" font-family="sans-serif" font-size="22" font-weight="700">现货折扣</text>
<rect x="298" y="390" width="205" height="64" rx="18" fill="#eee7d7"/><text x="400" y="430" text-anchor="middle" fill="#6f6241" font-family="sans-serif" font-size="22" font-weight="700">合约折扣</text>
<rect x="524" y="390" width="205" height="64" rx="18" fill="#f1e2d9"/><text x="626" y="430" text-anchor="middle" fill="#885f4b" font-family="sans-serif" font-size="22" font-weight="700">核对代币成本</text>
