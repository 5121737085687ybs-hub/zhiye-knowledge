<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="28" fill="#f2eee5"/><text x="56" y="68" fill="#17232e" font-family="sans-serif" font-size="30" font-weight="700">BYUSDT把Earn与UTA保证金连接起来</text><rect x="75" y="148" width="276" height="196" rx="20" fill="#d8e5dc"/><text x="106" y="198" fill="#17232e" font-family="sans-serif" font-size="24" font-weight="700">USDT Flexible</text><text x="106" y="246" fill="#455b60" font-family="sans-serif" font-size="19">先持有符合条件的</text><text x="106" y="277" fill="#455b60" font-family="sans-serif" font-size="19">Earn 资产</text><path d="M360 247h86" stroke="#d28a46" stroke-width="7"/><path d="m425 225 22 22-22 22" fill="none" stroke="#d28a46" stroke-width="7"/><rect x="466" y="148" width="220" height="196" rx="20" fill="#e8ddc8"/><text x="502" y="220" fill="#17232e" font-family="sans-serif" font-size="25" font-weight="700">BYUSDT</text><text x="502" y="268" fill="#455b60" font-family="sans-serif" font-size="19">平台内表示</text><text x="502" y="299" fill="#455b60" font-family="sans-serif" font-size="19">有用途限制</text><path d="M695 247h86" stroke="#d28a46" stroke-width="7"/><path d="m760 225 22 22-22 22" fill="none" stroke="#d28a46" stroke-width="7"/><rect x="800" y="148" width="226" height="196" rx="20" fill="#e7cfbf"/><text x="830" y="210" fill="#17232e" font-family="sans-serif" font-size="24" font-weight="700">UTA</text><text x="830" y="255" fill="#455b60" font-family="sans-serif" font-size="19">仅指定保证金</text><text x="830" y="286" fill="#455b60" font-family="sans-serif" font-size="19">模式可使用</text><rect x="75" y="400" width="951" height="55" rx="15" fill="#17232e"/><text x="100" y="436" fill="#f4f0e8" font-family="sans-serif" font-size="19">转换费、奖励APR、保证金损失与赎回条件都要另行核对。</text></svg>