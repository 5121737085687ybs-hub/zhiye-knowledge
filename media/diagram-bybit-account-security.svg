<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Bybit账户安全四步检查</title><desc id="desc">检查Bybit反钓鱼码与登录验证、设备会话、提币地址和异常处置。</desc>
<rect width="1200" height="700" rx="28" fill="#f5f2e9"/><text x="70" y="72" fill="#597267" font-family="sans-serif" font-size="18" letter-spacing="3">知页 · 安全清单</text><text x="70" y="135" fill="#203d34" font-family="sans-serif" font-size="42" font-weight="700">把账户保护做成日常检查</text>
<g font-family="sans-serif">
<rect x="70" y="190" width="500" height="170" rx="24" fill="#e1ebe3"/><circle cx="120" cy="240" r="25" fill="#315348"/><text x="120" y="248" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">1</text><text x="165" y="248" fill="#203d34" font-size="26" font-weight="700">确认消息真伪</text><text x="110" y="300" fill="#496057" font-size="19">设置反钓鱼码；不点陌生邮件和私信里的登录链接。</text>
<rect x="630" y="190" width="500" height="170" rx="24" fill="#eee7d7"/><circle cx="680" cy="240" r="25" fill="#6f6241"/><text x="680" y="248" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">2</text><text x="725" y="248" fill="#203d34" font-size="26" font-weight="700">加固登录与验证</text><text x="670" y="300" fill="#746c58" font-size="19">启用账户提供的多重验证或Passkey，保管好恢复方式。</text>
<rect x="70" y="400" width="500" height="170" rx="24" fill="#f1e2d9"/><circle cx="120" cy="450" r="25" fill="#885f4b"/><text x="120" y="458" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">3</text><text x="165" y="458" fill="#203d34" font-size="26" font-weight="700">收紧提币权限</text><text x="110" y="510" fill="#826b5d" font-size="19">核对地址白名单、新地址锁定与额度等可用选项。</text>
<rect x="630" y="400" width="500" height="170" rx="24" fill="#dce5df"/><circle cx="680" cy="450" r="25" fill="#536b48"/><text x="680" y="458" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">4</text><text x="725" y="458" fill="#203d34" font-size="26" font-weight="700">发现异常就处置</text><text x="670" y="510" fill="#496057" font-size="19">结束陌生会话、改密、停用可疑授权并联系官方支持。</text>
</g><path d="M570 275h60M570 485h60" stroke="#c7794b" stroke-width="5" stroke-linecap="round"/><text x="70" y="635" fill="#777a70" font-family="sans-serif" font-size="17">菜单、功能与资格可能变化；请以账户页面当前显示为准。</text></svg>
