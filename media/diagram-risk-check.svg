<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">转账前的三项核查</title>
  <desc id="desc">核实收益来源、运营主体和退出规则；保本高收益、催促转账或提现加收解冻费时先暂停。</desc>
  <rect width="1200" height="760" rx="18" fill="#f1f0e8"/>
  <text x="68" y="88" fill="#20241f" font-family="'Songti SC','Noto Serif CJK SC',serif" font-size="49">转账前，先核查这三件事</text>
  <text x="70" y="130" fill="#777a70" font-family="Arial,sans-serif" font-size="21" letter-spacing="2">不看宣传截图，找能独立验证的信息</text>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <g transform="translate(70 185)">
      <rect width="330" height="340" rx="8" fill="#fffefa"/>
      <text x="28" y="54" fill="#c7794b" font-family="Arial,sans-serif" font-size="19" letter-spacing="3">01 / SOURCE</text>
      <circle cx="164" cy="143" r="56" fill="#f1e4d8"/>
      <path d="M142 149h44M164 127v44" stroke="#c7794b" stroke-width="5" stroke-linecap="round"/>
      <text x="165" y="245" text-anchor="middle" fill="#20241f" font-size="36" font-weight="600">收益从哪里来？</text>
      <text x="165" y="293" text-anchor="middle" fill="#777a70" font-size="23">有没有真实、可核验的依据</text>
    </g>
    <g transform="translate(435 185)">
      <rect width="330" height="340" rx="8" fill="#fffefa"/>
      <text x="28" y="54" fill="#536b48" font-family="Arial,sans-serif" font-size="19" letter-spacing="3">02 / CUSTODY</text>
      <circle cx="164" cy="143" r="56" fill="#e4e9dc"/>
      <circle cx="164" cy="132" r="18" fill="none" stroke="#536b48" stroke-width="5"/>
      <path d="M130 177c5-25 17-36 34-36s29 11 34 36" fill="none" stroke="#536b48" stroke-width="5" stroke-linecap="round"/>
      <text x="165" y="245" text-anchor="middle" fill="#20241f" font-size="36" font-weight="600">谁在管理资金？</text>
      <text x="165" y="293" text-anchor="middle" fill="#777a70" font-size="23">主体、托管方能否确认</text>
    </g>
    <g transform="translate(800 185)">
      <rect width="330" height="340" rx="8" fill="#fffefa"/>
      <text x="28" y="54" fill="#536b48" font-family="Arial,sans-serif" font-size="19" letter-spacing="3">03 / EXIT</text>
      <circle cx="164" cy="143" r="56" fill="#e4e9dc"/>
      <path d="M139 143h46m-15-16 16 16-16 16" fill="none" stroke="#536b48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="165" y="245" text-anchor="middle" fill="#20241f" font-size="36" font-weight="600">退出规则清楚吗？</text>
      <text x="165" y="293" text-anchor="middle" fill="#777a70" font-size="23">提现步骤、时间和费用</text>
    </g>
  </g>
  <rect x="70" y="570" width="1060" height="105" rx="8" fill="#30452f"/>
  <circle cx="122" cy="622" r="24" fill="#d48152"/>
  <text x="122" y="631" text-anchor="middle" fill="#fffefa" font-family="Arial,sans-serif" font-size="28" font-weight="700">!</text>
  <text x="166" y="614" fill="#e2e99e" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="600">保本高收益 · 催你马上转账 · 提现先交“解冻费”</text>
  <text x="166" y="650" fill="#fffefa" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21">先暂停，再通过独立渠道核实</text>
  <text x="70" y="720" fill="#85877d" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">知页 · 风险识别</text>
  <text x="1130" y="720" text-anchor="end" fill="#85877d" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">PAUSE · VERIFY · DECIDE</text>
</svg>
