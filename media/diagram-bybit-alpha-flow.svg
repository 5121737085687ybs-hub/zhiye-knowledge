<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="24" fill="#f4f2eb"/><text x="55" y="70" font-family="sans-serif" font-size="30" font-weight="700" fill="#34443a">Alpha 操作前后的四步核对</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(45 135)"><rect width="245" height="290" rx="22" fill="#fbfaf6" stroke="#d6d8ca" stroke-width="3"/><circle cx="122" cy="65" r="36" fill="#dce7dc"/><text x="122" y="76" font-size="31" fill="#425447">1</text><text x="122" y="145" font-size="26" font-weight="700" fill="#34443a">确认入口</text><text x="122" y="190" font-size="18" fill="#687568">只使用官方页面</text><text x="122" y="223" font-size="18" fill="#687568">查看地区资格</text></g><g transform="translate(340 135)"><rect width="245" height="290" rx="22" fill="#fbfaf6" stroke="#d6d8ca" stroke-width="3"/><circle cx="122" cy="65" r="36" fill="#eadfca"/><text x="122" y="76" font-size="31" fill="#625943">2</text><text x="122" y="145" font-size="26" font-weight="700" fill="#34443a">核对代币</text><text x="122" y="190" font-size="18" fill="#687568">网络、合约与流动性</text><text x="122" y="223" font-size="18" fill="#687568">不凭名称和热度判断</text></g><g transform="translate(635 135)"><rect width="245" height="290" rx="22" fill="#fbfaf6" stroke="#d6d8ca" stroke-width="3"/><circle cx="122" cy="65" r="36" fill="#dce7dc"/><text x="122" y="76" font-size="31" fill="#425447">3</text><text x="122" y="145" font-size="26" font-weight="700" fill="#34443a">查看成本</text><text x="122" y="190" font-size="18" fill="#687568">滑点、网络与交易费用</text><text x="122" y="223" font-size="18" fill="#687568">确认预估数量</text></g><g transform="translate(930 135)"><rect width="225" height="290" rx="22" fill="#fbfaf6" stroke="#d6d8ca" stroke-width="3"/><circle cx="112" cy="65" r="36" fill="#eadfca"/><text x="112" y="76" font-size="31" fill="#625943">4</text><text x="112" y="145" font-size="26" font-weight="700" fill="#34443a">最后确认</text><text x="112" y="190" font-size="18" fill="#687568">逐项核对订单</text><text x="112" y="223" font-size="18" fill="#687568">不能接受就取消</text></g></g><path d="M295 280h35m255 0h35m255 0h35" stroke="#879687" stroke-width="5"/><text x="55" y="478" font-family="sans-serif" font-size="18" fill="#7a8478">链上交易具有市场、流动性、执行与合约风险</text></svg>