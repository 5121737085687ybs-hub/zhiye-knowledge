<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">永续合约资金费率机制</title><desc id="desc">参考市场价差和产品公式形成费率，在结算时影响多空持仓余额。</desc>
  <rect width="1200" height="630" rx="36" fill="#f5f2e9"/><text x="72" y="92" fill="#315348" font-family="sans-serif" font-size="22" letter-spacing="4">PERPETUAL FUNDING · A MECHANISM</text><text x="72" y="158" fill="#203d34" font-family="sans-serif" font-size="46" font-weight="700">费率会变，结算方向要看规则</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="90" y="238" width="265" height="164" rx="24" fill="#fffdf7" stroke="#83a494" stroke-width="3"/><text x="222" y="288" fill="#315348" font-size="21">市场价差</text><text x="222" y="340" fill="#263d35" font-size="26">合约 ↔ 参考价</text><text x="222" y="374" fill="#65746d" font-size="17">随需求而波动</text>
  <rect x="468" y="238" width="265" height="164" rx="24" fill="#fffdf7" stroke="#c8b573" stroke-width="3"/><text x="600" y="288" fill="#846a27" font-size="21">产品公式</text><text x="600" y="340" fill="#403e35" font-size="26">费率 × 名义价值</text><text x="600" y="374" fill="#746c58" font-size="17">周期和口径各异</text>
  <rect x="845" y="238" width="265" height="164" rx="24" fill="#fffdf7" stroke="#83a494" stroke-width="3"/><text x="977" y="288" fill="#315348" font-size="21">定时结算</text><text x="977" y="340" fill="#263d35" font-size="26">多空余额变化</text><text x="977" y="374" fill="#65746d" font-size="17">方向依当期费率</text></g>
  <g stroke="#82948b" stroke-width="4"><path d="M355 320h102"/><path d="M733 320h102"/></g><g fill="#82948b"><path d="m445 312 12 8-12 8z"/><path d="m823 312 12 8-12 8z"/></g>
  <text x="72" y="495" fill="#43584f" font-family="sans-serif" font-size="21">资金费只是衍生成本的一项；它不是固定利息，也不是套利保证。</text><text x="72" y="555" fill="#839087" font-family="sans-serif" font-size="16">知页 · 一般知识分享</text>
</svg>
