<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="1200" height="470" rx="24" fill="#f4f7fb"/><text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">开始跟单前，按顺序核对三件事</text><g font-family="Arial,sans-serif"><rect x="48" y="118" width="340" height="274" rx="22" fill="#fff" stroke="#d5dfed" stroke-width="3"/><rect x="48" y="118" width="340" height="58" rx="22" fill="#17243b"/><text x="218" y="156" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">一、看交易记录</text><g fill="#17243b" font-size="18"><text x="82" y="226">• 观察时间跨度和回撤</text><text x="82" y="269">• 查看未平仓仓位与杠杆</text><text x="82" y="312">• 核对跟随者实际盈亏</text><text x="82" y="355">• 理解数据口径与费用</text></g><rect x="430" y="118" width="340" height="274" rx="22" fill="#fff" stroke="#d5dfed" stroke-width="3"/><rect x="430" y="118" width="340" height="58" rx="22" fill="#344b78"/><text x="600" y="156" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">二、先设风险边界</text><g fill="#17243b" font-size="18"><text x="465" y="226">• 限定总投入和单笔额度</text><text x="465" y="269">• 检查跟单模式与杠杆</text><text x="465" y="312">• 设置可承受损失范围</text><text x="465" y="355">• 预留手续费与资金费用</text></g><rect x="812" y="118" width="340" height="274" rx="22" fill="#fff" stroke="#d5dfed" stroke-width="3"/><rect x="812" y="118" width="340" height="58" rx="22" fill="#70d6b5"/><text x="982" y="156" text-anchor="middle" fill="#17243b" font-size="23" font-weight="700">三、持续检查账户</text><g fill="#17243b" font-size="18"><text x="848" y="226">• 比较计划与实际结果</text><text x="848" y="269">• 留意风格或仓位变化</text><text x="848" y="312">• 确认停止跟随后的持仓</text><text x="848" y="355">• 定期检查资格与规则</text></g><path d="M390 252h35m345 0h35" stroke="#91a9ff" stroke-width="5" stroke-linecap="round"/><path d="m415 241 12 11-12 11m355-11 12 11-12 11" fill="none" stroke="#91a9ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="600" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52627a">不同跟单产品的功能与规则可能不同，页面显示为准</text></svg>