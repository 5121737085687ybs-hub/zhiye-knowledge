<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">UTA 组合保证金示意</title><desc id="desc">股票永续合约和期权可放在同一账户管理，对冲可能改变保证金计算，但亏损仍影响整体账户。</desc>
<rect width="1200" height="650" rx="30" fill="#f5f2e9"/><text x="58" y="70" fill="#597267" font-family="sans-serif" font-size="19" letter-spacing="3">UTA · PORTFOLIO MARGIN</text><text x="58" y="126" fill="#203d34" font-family="sans-serif" font-size="38" font-weight="700">同一账户管理，也意味着仓位风险相连</text>
<rect x="75" y="176" width="1050" height="354" rx="30" fill="#fffdf8" stroke="#315348" stroke-width="4"/><rect x="75" y="176" width="1050" height="76" rx="30" fill="#315348"/><text x="112" y="225" fill="#fffdf8" font-family="sans-serif" font-size="26" font-weight="700">统一交易账户 UTA</text>
<g font-family="sans-serif"><rect x="112" y="294" width="260" height="145" rx="22" fill="#e1ebe3"/><text x="142" y="337" fill="#315348" font-size="22" font-weight="700">股票永续仓位</text><path d="M145 398l52-34 44 17 56-48 40 24" fill="none" stroke="#789483" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="470" y="294" width="260" height="145" rx="22" fill="#f1e2d9"/><text x="500" y="337" fill="#885f4b" font-size="22" font-weight="700">期权仓位</text><text x="500" y="382" fill="#826b5d" font-size="18">看涨 / 看跌 / 组合</text><path d="M525 410h140" stroke="#ad866c" stroke-width="6" stroke-linecap="round"/>
<rect x="828" y="294" width="260" height="145" rx="22" fill="#eee7d7"/><text x="858" y="337" fill="#6f6241" font-size="22" font-weight="700">可用保证金</text><text x="858" y="382" fill="#746c58" font-size="18">依整体风险计算</text><rect x="858" y="402" width="180" height="12" rx="6" fill="#d7ccaf"/><rect x="858" y="402" width="118" height="12" rx="6" fill="#b39b68"/>
</g><path d="M385 367h68m-15-15 15 15-15 15M743 367h66m-15-15 15 15-15 15" fill="none" stroke="#597267" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="75" y="560" width="1050" height="54" rx="27" fill="#f1e2d9"/><text x="600" y="595" text-anchor="middle" fill="#7c5141" font-family="sans-serif" font-size="19" font-weight="700">对冲可能改变保证金占用；亏损仍会消耗账户余额，极端情况可能强平</text></svg>
