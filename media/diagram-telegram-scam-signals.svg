<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Telegram 常见诈骗信号</title><desc id="desc">识别假客服、验证码索取、虚假投资承诺、可疑文件和诱导扫码登录。</desc>
<rect width="1200" height="650" rx="30" fill="#f5f2e9"/><text x="58" y="70" fill="#597267" font-family="sans-serif" font-size="19" letter-spacing="3">SCAM SIGNALS</text><text x="58" y="125" fill="#203d34" font-family="sans-serif" font-size="38" font-weight="700">遇到这些要求，先停下来</text>
<g font-family="sans-serif">
<rect x="58" y="170" width="334" height="170" rx="22" fill="#f1e2d9"/><circle cx="101" cy="213" r="20" fill="#a36f55"/><text x="101" y="221" fill="#fffdf8" font-size="22" font-weight="700" text-anchor="middle">!</text><text x="138" y="221" fill="#554237" font-size="22" font-weight="700">假客服、假管理员</text><text x="87" y="270" fill="#826b5d" font-size="17">主动私信称能解封、退款、</text><text x="87" y="298" fill="#826b5d" font-size="17">处理账号或代为验证。</text>
<rect x="433" y="170" width="334" height="170" rx="22" fill="#eee7d7"/><circle cx="476" cy="213" r="20" fill="#846a27"/><text x="476" y="221" fill="#fffdf8" font-size="22" font-weight="700" text-anchor="middle">!</text><text x="513" y="221" fill="#403e35" font-size="22" font-weight="700">索要验证码或扫码</text><text x="462" y="270" fill="#746c58" font-size="17">让你转发登录码、扫描来路不明</text><text x="462" y="298" fill="#746c58" font-size="17">二维码，或共享屏幕。</text>
<rect x="808" y="170" width="334" height="170" rx="22" fill="#f1e2d9"/><circle cx="851" cy="213" r="20" fill="#a36f55"/><text x="851" y="221" fill="#fffdf8" font-size="22" font-weight="700" text-anchor="middle">!</text><text x="888" y="221" fill="#554237" font-size="22" font-weight="700">稳赚与资金解锁</text><text x="837" y="270" fill="#826b5d" font-size="17">保证收益、限时入金、先付税费</text><text x="837" y="298" fill="#826b5d" font-size="17">或保证金才可提现。</text>
<rect x="245" y="376" width="334" height="170" rx="22" fill="#eee7d7"/><circle cx="288" cy="419" r="20" fill="#846a27"/><text x="288" y="427" fill="#fffdf8" font-size="22" font-weight="700" text-anchor="middle">!</text><text x="325" y="427" fill="#403e35" font-size="22" font-weight="700">不明链接或安装包</text><text x="274" y="476" fill="#746c58" font-size="17">催你安装远程控制软件、未知</text><text x="274" y="504" fill="#746c58" font-size="17">APK、执行文件或浏览器插件。</text>
<rect x="621" y="376" width="334" height="170" rx="22" fill="#e1ebe3"/><circle cx="664" cy="419" r="20" fill="#315348"/><text x="664" y="427" fill="#fffdf8" font-size="22" font-weight="700" text-anchor="middle">!</text><text x="701" y="427" fill="#263d35" font-size="22" font-weight="700">索要钱包秘密</text><text x="650" y="476" fill="#62746a" font-size="17">助记词、私钥、恢复码和一次性</text><text x="650" y="504" fill="#62746a" font-size="17">密码都不应交给任何人。</text>
</g>
<rect x="58" y="574" width="1084" height="48" rx="24" fill="#315348"/><text x="600" y="605" fill="#fffdf8" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle">停止互动 → 独立核实官方入口 → 封锁与举报 → 保护其他账号</text>
</svg>
