<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Bybit MNT手续费抵扣四步核对</title><desc id="desc">核对产品是否适用、在账户开启对应抵扣开关、确认统一交易账户中有足够可用MNT，再比较综合成本。</desc>
<rect width="1200" height="700" rx="28" fill="#f5f2e9"/><text x="70" y="72" fill="#597267" font-family="sans-serif" font-size="18" letter-spacing="3">知页 · 费用核对</text><text x="70" y="135" fill="#203d34" font-family="sans-serif" font-size="42" font-weight="700">启用前先确认四个条件</text>
<g font-family="sans-serif">
<rect x="70" y="190" width="500" height="170" rx="24" fill="#e1ebe3"/><circle cx="120" cy="240" r="25" fill="#315348"/><text x="120" y="248" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">1</text><text x="165" y="248" fill="#203d34" font-size="26" font-weight="700">确认产品支持</text><text x="110" y="300" fill="#496057" font-size="19">现货与合约范围不同；反向合约等不一定适用。</text>
<rect x="630" y="190" width="500" height="170" rx="24" fill="#eee7d7"/><circle cx="680" cy="240" r="25" fill="#6f6241"/><text x="680" y="248" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">2</text><text x="725" y="248" fill="#203d34" font-size="26" font-weight="700">单独开启对应开关</text><text x="670" y="300" fill="#746c58" font-size="19">现货、合约、主账户与子账户需分别查看。</text>
<rect x="70" y="400" width="500" height="170" rx="24" fill="#f1e2d9"/><circle cx="120" cy="450" r="25" fill="#885f4b"/><text x="120" y="458" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">3</text><text x="165" y="458" fill="#203d34" font-size="26" font-weight="700">检查可用MNT余额</text><text x="110" y="510" fill="#826b5d" font-size="19">费用从UTA可用MNT扣；不足时按常规币种计费。</text>
<rect x="630" y="400" width="500" height="170" rx="24" fill="#dce5df"/><circle cx="680" cy="450" r="25" fill="#536b48"/><text x="680" y="458" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">4</text><text x="725" y="458" fill="#203d34" font-size="26" font-weight="700">比较综合成本</text><text x="670" y="510" fill="#496057" font-size="19">将名义折扣与MNT价格、费率和其他优惠一起看。</text>
</g><path d="M570 275h60M570 485h60" stroke="#c7794b" stroke-width="5" stroke-linecap="round"/><text x="70" y="635" fill="#777a70" font-family="sans-serif" font-size="17">实际可用范围、费率和余额要求以当前账户与产品页面为准。</text></svg>