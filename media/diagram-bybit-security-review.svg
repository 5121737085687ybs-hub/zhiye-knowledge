<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">交易平台安全信息四层核对</title><desc id="desc">分别查看事件范围、储备证明、风险防控披露和自身的账户与托管风险，理解每类信息的局限。</desc>
<rect width="1200" height="700" rx="28" fill="#f5f2e9"/><text x="70" y="72" fill="#597267" font-family="sans-serif" font-size="18" letter-spacing="3">知页 · 信息核验</text><text x="70" y="135" fill="#203d34" font-family="sans-serif" font-size="42" font-weight="700">把平台安全信息拆成四个问题</text>
<g font-family="sans-serif">
<rect x="70" y="190" width="500" height="170" rx="24" fill="#f1e2d9"/><circle cx="120" cy="240" r="25" fill="#885f4b"/><text x="120" y="248" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">1</text><text x="165" y="248" fill="#203d34" font-size="26" font-weight="700">事件影响了什么</text><text x="110" y="300" fill="#826b5d" font-size="19">资产、钱包、系统与客户影响分别核对。</text>
<rect x="630" y="190" width="500" height="170" rx="24" fill="#e1ebe3"/><circle cx="680" cy="240" r="25" fill="#315348"/><text x="680" y="248" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">2</text><text x="725" y="248" fill="#203d34" font-size="26" font-weight="700">储备证明覆盖什么</text><text x="670" y="300" fill="#496057" font-size="19">看快照日期、资产范围、负债和验证方法。</text>
<rect x="70" y="400" width="500" height="170" rx="24" fill="#eee7d7"/><circle cx="120" cy="450" r="25" fill="#6f6241"/><text x="120" y="458" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">3</text><text x="165" y="458" fill="#203d34" font-size="26" font-weight="700">区分公司披露与验证</text><text x="110" y="510" fill="#746c58" font-size="19">报告指标要看来源、期间、范围及独立核查。</text>
<rect x="630" y="400" width="500" height="170" rx="24" fill="#dce5df"/><circle cx="680" cy="450" r="25" fill="#536b48"/><text x="680" y="458" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">4</text><text x="725" y="458" fill="#203d34" font-size="26" font-weight="700">评估自身承受能力</text><text x="670" y="510" fill="#496057" font-size="19">分散托管风险，勿把交易平台当作无风险存款。</text>
</g><path d="M570 275h60M570 485h60" stroke="#c7794b" stroke-width="5" stroke-linecap="round"/><text x="70" y="635" fill="#777a70" font-family="sans-serif" font-size="17">历史事件、审计结果和安全措施都不能保证未来不会发生风险。</text></svg>