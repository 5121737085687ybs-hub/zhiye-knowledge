<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Bybit账户安全检查封面</title><desc id="desc">用反钓鱼码、Passkey和提币保护降低账户被冒用的风险。</desc>
<rect width="1200" height="630" rx="34" fill="#f5f2e9"/><circle cx="960" cy="315" r="250" fill="#e1ebe3"/><circle cx="960" cy="315" r="170" fill="#d4e0d6"/>
<text x="72" y="82" fill="#597267" font-family="sans-serif" font-size="20" letter-spacing="4">知页 · 账户安全</text>
<text x="72" y="185" fill="#203d34" font-family="sans-serif" font-size="52" font-weight="700">先守住账户入口</text>
<text x="74" y="245" fill="#496057" font-family="sans-serif" font-size="29">Bybit安全设置与防钓鱼检查</text>
<g transform="translate(800 170)"><path d="M160 0 285 48v101c0 96-67 164-125 190C102 313 35 245 35 149V48z" fill="#fffdf8" stroke="#315348" stroke-width="8"/><path d="m102 158 42 42 81-92" fill="none" stroke="#789483" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><circle cx="274" cy="53" r="14" fill="#c7794b"/></g>
<rect x="72" y="390" width="205" height="64" rx="18" fill="#e1ebe3"/><text x="174" y="430" text-anchor="middle" fill="#315348" font-family="sans-serif" font-size="22" font-weight="700">识别真消息</text>
<rect x="298" y="390" width="205" height="64" rx="18" fill="#eee7d7"/><text x="400" y="430" text-anchor="middle" fill="#6f6241" font-family="sans-serif" font-size="22" font-weight="700">保护登录</text>
<rect x="524" y="390" width="205" height="64" rx="18" fill="#f1e2d9"/><text x="626" y="430" text-anchor="middle" fill="#885f4b" font-family="sans-serif" font-size="22" font-weight="700">核对提币</text>
<text x="72" y="558" fill="#777a70" font-family="sans-serif" font-size="17" letter-spacing="2">安全设置能降低风险，但不能保证账户绝对安全</text></svg>
