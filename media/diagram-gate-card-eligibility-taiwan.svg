<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="24" fill="#101827"/><text x="60" y="75" fill="#fff" font-family="Arial,sans-serif" font-size="33" font-weight="700">Gate Card 申请前核对</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="70" y="180" width="230" height="170" rx="20" fill="#1b2a3d"/><text x="185" y="238" fill="#c5ff2f" font-size="24" font-weight="700">① 地区</text><text x="185" y="292" fill="#fff" font-size="20">申请页是否可选</text><rect x="355" y="180" width="230" height="170" rx="20" fill="#1b2a3d"/><text x="470" y="238" fill="#c5ff2f" font-size="24" font-weight="700">② 身份</text><text x="470" y="292" fill="#fff" font-size="20">资料须真实一致</text><rect x="640" y="180" width="230" height="170" rx="20" fill="#1b2a3d"/><text x="755" y="238" fill="#c5ff2f" font-size="24" font-weight="700">③ 费用</text><text x="755" y="292" fill="#fff" font-size="20">汇兑、外币、取现</text><rect x="925" y="180" width="205" height="170" rx="20" fill="#1b2a3d"/><text x="1027" y="238" fill="#c5ff2f" font-size="24" font-weight="700">④ 支付</text><text x="1027" y="292" fill="#fff" font-size="20">钱包与商户条件</text></g><g stroke="#c5ff2f" stroke-width="4"><path d="M300 265h50"/><path d="M585 265h50"/><path d="M870 265h50"/></g><rect x="70" y="425" width="1060" height="95" rx="18" fill="#18263a"/><text x="600" y="483" text-anchor="middle" fill="#d2dbe8" font-family="Arial,sans-serif" font-size="22">宣传页面不等于申卡资格；活动权益以卡片条款和申请页为准</text></svg>