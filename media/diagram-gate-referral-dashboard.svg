<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="24" fill="#101827"/><text x="60" y="78" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">推广后台数据阅读顺序</text><g font-family="Arial,sans-serif"><rect x="72" y="160" width="490" height="150" rx="22" fill="#1b2a3d"/><circle cx="145" cy="235" r="36" fill="#c5ff2f"/><text x="145" y="245" text-anchor="middle" fill="#101827" font-size="28" font-weight="700">1</text><text x="210" y="220" fill="#fff" font-size="27" font-weight="700">确认推广资格</text><text x="210" y="265" fill="#aab6c6" font-size="20">账户显示入口或正式批准</text><rect x="638" y="160" width="490" height="150" rx="22" fill="#1b2a3d"/><circle cx="710" cy="235" r="36" fill="#c5ff2f"/><text x="710" y="245" text-anchor="middle" fill="#101827" font-size="28" font-weight="700">2</text><text x="775" y="220" fill="#fff" font-size="27" font-weight="700">核对邀请链接</text><text x="775" y="265" fill="#aab6c6" font-size="20">官方域名、邀请码、受众地区</text><rect x="72" y="355" width="490" height="150" rx="22" fill="#1b2a3d"/><circle cx="145" cy="430" r="36" fill="#c5ff2f"/><text x="145" y="440" text-anchor="middle" fill="#101827" font-size="28" font-weight="700">3</text><text x="210" y="415" fill="#fff" font-size="27" font-weight="700">区分预估与结算</text><text x="210" y="460" fill="#aab6c6" font-size="20">按账户流水与条款核对金额</text><rect x="638" y="355" width="490" height="150" rx="22" fill="#1b2a3d"/><circle cx="710" cy="430" r="36" fill="#c5ff2f"/><text x="710" y="440" text-anchor="middle" fill="#101827" font-size="28" font-weight="700">4</text><text x="775" y="415" fill="#fff" font-size="27" font-weight="700">检查权限与安全</text><text x="775" y="460" fill="#aab6c6" font-size="20">不分享密码、验证码或 API 密钥</text></g><text x="60" y="565" fill="#c5ff2f" font-family="Arial,sans-serif" font-size="22">菜单、资格、费率和结算方式以登录后的官方页面为准</text></svg>
