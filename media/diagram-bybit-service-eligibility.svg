<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><rect width="1200" height="470" rx="24" fill="#f4f2eb"/><text x="52" y="65" font-family="sans-serif" font-size="29" font-weight="700" fill="#34443a">查看平台服务资格时，依次核对四项</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(48 125)"><rect width="250" height="260" rx="22" fill="#fbfaf6" stroke="#d6d8ca" stroke-width="3"/><circle cx="125" cy="58" r="31" fill="#dce7dc"/><text x="125" y="68" font-size="27" fill="#425447">1</text><text x="125" y="121" font-size="23" font-weight="700" fill="#34443a">服务限制名单</text><text x="125" y="164" font-size="17" fill="#687568">核对当前地区与</text><text x="125" y="192" font-size="17" fill="#687568">适用服务主体</text></g><g transform="translate(340 125)"><rect width="250" height="260" rx="22" fill="#fbfaf6" stroke="#d6d8ca" stroke-width="3"/><circle cx="125" cy="58" r="31" fill="#eadfca"/><text x="125" y="68" font-size="27" fill="#625943">2</text><text x="125" y="121" font-size="23" font-weight="700" fill="#34443a">真实资料</text><text x="125" y="164" font-size="17" fill="#687568">居住地、身份与</text><text x="125" y="192" font-size="17" fill="#687568">证明按实填写</text></g><g transform="translate(632 125)"><rect width="250" height="260" rx="22" fill="#fbfaf6" stroke="#d6d8ca" stroke-width="3"/><circle cx="125" cy="58" r="31" fill="#dce7dc"/><text x="125" y="68" font-size="27" fill="#425447">3</text><text x="125" y="121" font-size="23" font-weight="700" fill="#34443a">产品资格</text><text x="125" y="164" font-size="17" fill="#687568">不同产品可能有</text><text x="125" y="192" font-size="17" fill="#687568">额外准入条件</text></g><g transform="translate(924 125)"><rect width="225" height="260" rx="22" fill="#fbfaf6" stroke="#d6d8ca" stroke-width="3"/><circle cx="112" cy="58" r="31" fill="#eadfca"/><text x="112" y="68" font-size="27" fill="#625943">4</text><text x="112" y="121" font-size="23" font-weight="700" fill="#34443a">遇到提示</text><text x="112" y="164" font-size="17" fill="#687568">暂停操作并通过</text><text x="112" y="192" font-size="17" fill="#687568">官方渠道咨询</text></g></g><text x="52" y="433" font-family="sans-serif" font-size="17" fill="#7a8478">不要虚报居住地、切换网络节点或借用他人资料以绕过限制</text></svg>