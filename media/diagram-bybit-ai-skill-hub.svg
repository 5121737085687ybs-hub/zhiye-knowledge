<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><rect width="1200" height="500" rx="24" fill="#f4f2eb"/><text x="52" y="65" font-family="sans-serif" font-size="29" font-weight="700" fill="#34443a">AI 交易技能的连接链路与风险边界</text><g font-family="sans-serif" text-anchor="middle"><g transform="translate(45 135)"><rect width="220" height="220" rx="22" fill="#fbfaf6" stroke="#d6d8ca" stroke-width="3"/><circle cx="110" cy="48" r="27" fill="#dce7dc"/><text x="110" y="57" font-size="24" fill="#425447">1</text><text x="110" y="108" font-size="22" font-weight="700" fill="#34443a">技能说明</text><text x="110" y="148" font-size="16" fill="#687568">查看发布者、版本</text><text x="110" y="175" font-size="16" fill="#687568">和每项操作能力</text></g><g transform="translate(335 135)"><rect width="220" height="220" rx="22" fill="#fbfaf6" stroke="#d6d8ca" stroke-width="3"/><circle cx="110" cy="48" r="27" fill="#eadfca"/><text x="110" y="57" font-size="24" fill="#625943">2</text><text x="110" y="108" font-size="22" font-weight="700" fill="#34443a">AI 助手</text><text x="110" y="148" font-size="16" fill="#687568">理解请求、整理参数</text><text x="110" y="175" font-size="16" fill="#687568">仍可能理解错误</text></g><g transform="translate(625 135)"><rect width="220" height="220" rx="22" fill="#fbfaf6" stroke="#d6d8ca" stroke-width="3"/><circle cx="110" cy="48" r="27" fill="#dce7dc"/><text x="110" y="57" font-size="24" fill="#425447">3</text><text x="110" y="108" font-size="22" font-weight="700" fill="#34443a">API 权限</text><text x="110" y="148" font-size="16" fill="#687568">决定账户可查询</text><text x="110" y="175" font-size="16" fill="#687568">或执行哪些操作</text></g><g transform="translate(915 135)"><rect width="230" height="220" rx="22" fill="#fbfaf6" stroke="#d6d8ca" stroke-width="3"/><circle cx="115" cy="48" r="27" fill="#eadfca"/><text x="115" y="57" font-size="24" fill="#625943">4</text><text x="115" y="108" font-size="22" font-weight="700" fill="#34443a">人工核对</text><text x="115" y="148" font-size="16" fill="#687568">检查方向、数量和</text><text x="115" y="175" font-size="16" fill="#687568">账户后再确认</text></g></g><path d="M270 245h57m235 0h57m235 0h57" stroke="#879687" stroke-width="5"/><text x="52" y="416" font-family="sans-serif" font-size="18" fill="#7a8478">技能被移除不代表已开仓位自动关闭；API 密钥、账户和持仓需分别管理</text><text x="52" y="453" font-family="sans-serif" font-size="17" fill="#7a8478">先核对服务地区资格。台湾在 Bybit 当前受限地区名单中，不要尝试绕过限制。</text></svg>