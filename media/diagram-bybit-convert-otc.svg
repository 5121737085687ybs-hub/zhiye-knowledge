<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="28" fill="#f2eee5"/><text x="56" y="68" fill="#17232e" font-family="sans-serif" font-size="30" font-weight="700">选择兑换方式时，比较执行条件</text><rect x="68" y="138" width="285" height="218" rx="20" fill="#d8e5dc"/><text x="100" y="190" fill="#17232e" font-family="sans-serif" font-size="24" font-weight="700">即时 Convert</text><text x="100" y="240" fill="#455b60" font-family="sans-serif" font-size="19">看当前报价</text><text x="100" y="278" fill="#455b60" font-family="sans-serif" font-size="19">确认后立即执行</text><text x="100" y="320" fill="#455b60" font-family="sans-serif" font-size="17">关注到账数量与费用</text><rect x="408" y="138" width="285" height="218" rx="20" fill="#e8ddc8"/><text x="440" y="190" fill="#17232e" font-family="sans-serif" font-size="24" font-weight="700">限价 Convert</text><text x="440" y="240" fill="#455b60" font-family="sans-serif" font-size="19">设定目标汇率</text><text x="440" y="278" fill="#455b60" font-family="sans-serif" font-size="19">等待条件满足</text><text x="440" y="320" fill="#455b60" font-family="sans-serif" font-size="17">资金可能被订单占用</text><rect x="748" y="138" width="284" height="218" rx="20" fill="#e7cfbf"/><text x="780" y="190" fill="#17232e" font-family="sans-serif" font-size="24" font-weight="700">OTC 报价</text><text x="780" y="240" fill="#455b60" font-family="sans-serif" font-size="19">特定大额订单</text><text x="780" y="278" fill="#455b60" font-family="sans-serif" font-size="19">资格与币种有限</text><text x="780" y="320" fill="#455b60" font-family="sans-serif" font-size="17">先看具体资格说明</text><rect x="68" y="411" width="964" height="52" rx="14" fill="#17232e"/><text x="98" y="445" fill="#f4f0e8" font-family="sans-serif" font-size="19">零传统交易费不等于没有价差、地区费用或价格风险。</text></svg>