<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380"><rect width="1200" height="380" rx="24" fill="#f4f7fb"/><text x="600" y="60" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#17243b">连接后仍要逐项核对</text><g font-family="Arial" text-anchor="middle"><rect x="65" y="115" width="300" height="190" rx="20" fill="#fff" stroke="#d5dfed" stroke-width="3"/><text x="215" y="175" font-size="25" font-weight="700" fill="#17243b">账户授权</text><text x="215" y="220" font-size="19" fill="#52627a">确认域名与授权页面</text><text x="215" y="255" font-size="19" fill="#52627a">只在本人设备登录</text><path d="M385 210h90" stroke="#f7a928" stroke-width="6"/><path d="M465 195l22 15-22 15" fill="none" stroke="#f7a928" stroke-width="6"/><rect x="495" y="115" width="300" height="190" rx="20" fill="#fff" stroke="#d5dfed" stroke-width="3"/><text x="645" y="175" font-size="25" font-weight="700" fill="#17243b">下单检查</text><text x="645" y="220" font-size="19" fill="#52627a">核对品种、账户与方向</text><text x="645" y="255" font-size="19" fill="#52627a">检查数量、价格及类型</text><path d="M815 210h90" stroke="#70d6b5" stroke-width="6"/><path d="M895 195l22 15-22 15" fill="none" stroke="#70d6b5" stroke-width="6"/><rect x="925" y="115" width="220" height="190" rx="20" fill="#fff" stroke="#d5dfed" stroke-width="3"/><text x="1035" y="175" font-size="25" font-weight="700" fill="#17243b">定期断开</text><text x="1035" y="220" font-size="19" fill="#52627a">检查授权状态</text><text x="1035" y="255" font-size="19" fill="#52627a">不用时退出</text></g></svg>