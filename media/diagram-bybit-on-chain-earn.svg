<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520"><rect width="1100" height="520" rx="28" fill="#f2eee5"/><text x="56" y="68" fill="#17232e" font-family="sans-serif" font-size="30" font-weight="700">从产品入口继续追到实际收益来源</text><rect x="62" y="138" width="210" height="190" rx="20" fill="#d8e5dc"/><text x="88" y="190" fill="#17232e" font-family="sans-serif" font-size="22" font-weight="700">持有收益代币</text><text x="88" y="244" fill="#455b60" font-family="sans-serif" font-size="18">兑换比例或</text><text x="88" y="275" fill="#455b60" font-family="sans-serif" font-size="18">奖励代币变化</text><rect x="298" y="138" width="210" height="190" rx="20" fill="#e8ddc8"/><text x="324" y="190" fill="#17232e" font-family="sans-serif" font-size="22" font-weight="700">质押网络资产</text><text x="324" y="244" fill="#455b60" font-family="sans-serif" font-size="18">验证者与</text><text x="324" y="275" fill="#455b60" font-family="sans-serif" font-size="18">解绑周期</text><rect x="534" y="138" width="210" height="190" rx="20" fill="#dce1eb"/><text x="560" y="190" fill="#17232e" font-family="sans-serif" font-size="22" font-weight="700">Farm / Vault</text><text x="560" y="244" fill="#455b60" font-family="sans-serif" font-size="18">协议、流动性</text><text x="560" y="275" fill="#455b60" font-family="sans-serif" font-size="18">与策略风险</text><rect x="770" y="138" width="270" height="190" rx="20" fill="#e7cfbf"/><text x="800" y="190" fill="#17232e" font-family="sans-serif" font-size="22" font-weight="700">赎回到账</text><text x="800" y="244" fill="#455b60" font-family="sans-serif" font-size="18">取决于链上处理、</text><text x="800" y="275" fill="#455b60" font-family="sans-serif" font-size="18">协议流动性和期限</text><path d="M282 232h12m210 0h24m210 0h24" stroke="#d28a46" stroke-width="7"/><rect x="62" y="397" width="978" height="56" rx="15" fill="#17232e"/><text x="92" y="433" fill="#f4f0e8" font-family="sans-serif" font-size="19">APR可变且不保证；确认产品机制、费用、第三方与地区资格。</text></svg>