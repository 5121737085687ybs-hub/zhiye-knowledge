<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">跟单结果的主要影响因素</title><desc id="desc">历史策略、跟随执行、费用和市场波动都会改变复制交易的实际结果。</desc>
  <rect width="1200" height="630" rx="36" fill="#f5f2e9"/><text x="72" y="92" fill="#315348" font-family="sans-serif" font-size="22" letter-spacing="4">COPY TRADING · RISK FACTORS</text><text x="72" y="158" fill="#203d34" font-family="sans-serif" font-size="46" font-weight="700">复制操作，结果仍可能不同</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="72" y="242" width="240" height="164" rx="24" fill="#fffdf7" stroke="#83a494" stroke-width="3"/><text x="192" y="292" fill="#315348" font-size="21">领单策略</text><text x="192" y="341" fill="#293e36" font-size="24">仓位 · 杠杆</text><text x="192" y="375" fill="#65746d" font-size="17">表现随时间变化</text>
  <rect x="350" y="242" width="240" height="164" rx="24" fill="#fffdf7" stroke="#83a494" stroke-width="3"/><text x="470" y="292" fill="#315348" font-size="21">跟随执行</text><text x="470" y="341" fill="#293e36" font-size="24">延迟 · 成交偏差</text><text x="470" y="375" fill="#65746d" font-size="17">可能无法完全复制</text>
  <rect x="628" y="242" width="240" height="164" rx="24" fill="#fffdf7" stroke="#c8b573" stroke-width="3"/><text x="748" y="292" fill="#846a27" font-size="21">交易成本</text><text x="748" y="341" fill="#293e36" font-size="24">费用 · 滑点</text><text x="748" y="375" fill="#65746d" font-size="17">按账户分别发生</text>
  <rect x="906" y="242" width="240" height="164" rx="24" fill="#fffdf7" stroke="#c8b573" stroke-width="3"/><text x="1026" y="292" fill="#846a27" font-size="21">市场与退出</text><text x="1026" y="341" fill="#293e36" font-size="24">波动 · 流动性</text><text x="1026" y="375" fill="#65746d" font-size="17">止损也有执行风险</text></g>
  <g stroke="#82948b" stroke-width="4"><path d="M316 324h28"/><path d="M594 324h28"/><path d="M872 324h28"/></g><g fill="#82948b"><path d="m337 316 12 8-12 8z"/><path d="m615 316 12 8-12 8z"/><path d="m893 316 12 8-12 8z"/></g>
  <text x="72" y="505" fill="#43584f" font-family="sans-serif" font-size="22">榜单和历史回报不能保证未来；先看回撤、仓位、费用与退出方式。</text><text x="72" y="563" fill="#839087" font-family="sans-serif" font-size="16">知页 · 一般知识分享</text>
</svg>
