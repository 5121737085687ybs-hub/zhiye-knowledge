<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><rect width="1200" height="400" rx="24" fill="#f4f7fb"/><text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#17243b">模拟练习的四步循环</text><g font-family="Arial" font-size="22" text-anchor="middle"><g><rect x="55" y="130" width="245" height="190" rx="20" fill="#fff" stroke="#d5dfed" stroke-width="3"/><circle cx="177" cy="180" r="28" fill="#f7a928"/><text x="177" y="188" font-weight="700" fill="#17243b">1</text><text x="177" y="245" fill="#17243b" font-weight="700">选择模拟模式</text><text x="177" y="280" fill="#52627a" font-size="18">确认虚拟账户</text></g><g><rect x="345" y="130" width="245" height="190" rx="20" fill="#fff" stroke="#d5dfed" stroke-width="3"/><circle cx="467" cy="180" r="28" fill="#70d6b5"/><text x="467" y="188" font-weight="700" fill="#17243b">2</text><text x="467" y="245" fill="#17243b" font-weight="700">练习下单</text><text x="467" y="280" fill="#52627a" font-size="18">试限价与市价</text></g><g><rect x="635" y="130" width="245" height="190" rx="20" fill="#fff" stroke="#d5dfed" stroke-width="3"/><circle cx="757" cy="180" r="28" fill="#7898ef"/><text x="757" y="188" font-weight="700" fill="#fff">3</text><text x="757" y="245" fill="#17243b" font-weight="700">核对风险栏</text><text x="757" y="280" fill="#52627a" font-size="18">保证金与止损</text></g><g><rect x="925" y="130" width="220" height="190" rx="20" fill="#fff" stroke="#d5dfed" stroke-width="3"/><circle cx="1035" cy="180" r="28" fill="#ed8a78"/><text x="1035" y="188" font-weight="700" fill="#fff">4</text><text x="1035" y="245" fill="#17243b" font-weight="700">记录并复盘</text><text x="1035" y="280" fill="#52627a" font-size="18">检查偏差来源</text></g></g></svg>