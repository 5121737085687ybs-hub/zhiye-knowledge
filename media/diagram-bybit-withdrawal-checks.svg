<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540"><rect width="1200" height="540" rx="28" fill="#eef1e9"/><text x="60" y="75" font-size="34" font-weight="700" fill="#293a31" font-family="sans-serif">链上提领的确认顺序</text><g font-family="sans-serif" text-anchor="middle"><rect x="50" y="150" width="250" height="230" rx="22" fill="#fffdf8"/><text x="175" y="210" font-size="25" font-weight="700" fill="#293a31">1 · 收款端</text><text x="175" y="260" font-size="20" fill="#606b64">确认资产与网路</text><text x="175" y="295" font-size="20" fill="#606b64">复制地址与备注码</text><rect x="345" y="150" width="250" height="230" rx="22" fill="#fffdf8"/><text x="470" y="210" font-size="25" font-weight="700" fill="#293a31">2 · 发送端</text><text x="470" y="260" font-size="20" fill="#606b64">选相同资产与网路</text><text x="470" y="295" font-size="20" fill="#606b64">核对完整地址</text><rect x="640" y="150" width="250" height="230" rx="22" fill="#fffdf8"/><text x="765" y="210" font-size="25" font-weight="700" fill="#293a31">3 · 小额测试</text><text x="765" y="260" font-size="20" fill="#606b64">检查手续费与到帐</text><text x="765" y="295" font-size="20" fill="#606b64">确认后再处理余额</text><rect x="935" y="150" width="215" height="230" rx="22" fill="#fffdf8"/><text x="1042" y="210" font-size="25" font-weight="700" fill="#293a31">4 · 留存纪录</text><text x="1042" y="260" font-size="20" fill="#606b64">保存订单号</text><text x="1042" y="295" font-size="20" fill="#606b64">必要时查 TxID</text></g><path d="M302 265h40M597 265h40M892 265h40" stroke="#b87554" stroke-width="8" stroke-linecap="round"/><text x="60" y="455" font-size="22" fill="#8b513a" font-family="sans-serif">链上转帐通常不可撤销。不同平台、网路与资产规则请逐笔确认。</text></svg>