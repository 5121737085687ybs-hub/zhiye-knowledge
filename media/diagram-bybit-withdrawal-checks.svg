<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540"><rect width="1200" height="540" rx="28" fill="#eef1e9"/><text x="60" y="75" font-size="34" font-weight="700" fill="#293a31" font-family="sans-serif">鏈上提領的確認順序</text><g font-family="sans-serif" text-anchor="middle"><rect x="50" y="150" width="250" height="230" rx="22" fill="#fffdf8"/><text x="175" y="210" font-size="25" font-weight="700" fill="#293a31">1 · 收款端</text><text x="175" y="260" font-size="20" fill="#606b64">確認資產與網路</text><text x="175" y="295" font-size="20" fill="#606b64">複製地址與備註碼</text><rect x="345" y="150" width="250" height="230" rx="22" fill="#fffdf8"/><text x="470" y="210" font-size="25" font-weight="700" fill="#293a31">2 · 發送端</text><text x="470" y="260" font-size="20" fill="#606b64">選相同資產與網路</text><text x="470" y="295" font-size="20" fill="#606b64">核對完整地址</text><rect x="640" y="150" width="250" height="230" rx="22" fill="#fffdf8"/><text x="765" y="210" font-size="25" font-weight="700" fill="#293a31">3 · 小額測試</text><text x="765" y="260" font-size="20" fill="#606b64">檢查手續費與到帳</text><text x="765" y="295" font-size="20" fill="#606b64">確認後再處理餘額</text><rect x="935" y="150" width="215" height="230" rx="22" fill="#fffdf8"/><text x="1042" y="210" font-size="25" font-weight="700" fill="#293a31">4 · 留存紀錄</text><text x="1042" y="260" font-size="20" fill="#606b64">保存訂單號</text><text x="1042" y="295" font-size="20" fill="#606b64">必要時查 TxID</text></g><path d="M302 265h40M597 265h40M892 265h40" stroke="#b87554" stroke-width="8" stroke-linecap="round"/><text x="60" y="455" font-size="22" fill="#8b513a" font-family="sans-serif">鏈上轉帳通常不可撤銷。不同平台、網路與資產規則請逐筆確認。</text></svg>