<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">去中心化交易中的兑换流程</title>
  <desc id="desc">用户通过钱包调用智能合约，合约读取流动性池并更新两种代币的状态。</desc>
  <rect width="1200" height="620" rx="36" fill="#f4f8f7"/>
  <text x="70" y="88" fill="#173b3b" font-family="Arial,sans-serif" font-size="34" font-weight="700">DEX 兑换的四个步骤</text>
  <text x="70" y="130" fill="#587070" font-family="Arial,sans-serif" font-size="20">报价会受池子深度、订单大小和网络状态影响</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g><rect x="70" y="230" width="245" height="180" rx="24" fill="#fff" stroke="#a8ceca" stroke-width="3"/><circle cx="192" cy="277" r="29" fill="#d8efeb"/><text x="192" y="286" fill="#176c67" font-size="23" font-weight="700">1</text><text x="192" y="340" fill="#173b3b" font-size="23" font-weight="700">选择交易</text><text x="192" y="375" fill="#587070" font-size="17">网络 · 代币 · 数量</text></g>
    <g><rect x="355" y="230" width="245" height="180" rx="24" fill="#fff" stroke="#a8ceca" stroke-width="3"/><circle cx="477" cy="277" r="29" fill="#d8efeb"/><text x="477" y="286" fill="#176c67" font-size="23" font-weight="700">2</text><text x="477" y="340" fill="#173b3b" font-size="23" font-weight="700">查看报价</text><text x="477" y="375" fill="#587070" font-size="17">滑点 · 费用 · 最低收到</text></g>
    <g><rect x="640" y="230" width="245" height="180" rx="24" fill="#fff" stroke="#a8ceca" stroke-width="3"/><circle cx="762" cy="277" r="29" fill="#d8efeb"/><text x="762" y="286" fill="#176c67" font-size="23" font-weight="700">3</text><text x="762" y="340" fill="#173b3b" font-size="23" font-weight="700">钱包签名</text><text x="762" y="375" fill="#587070" font-size="17">确认交易与授权范围</text></g>
    <g><rect x="925" y="230" width="205" height="180" rx="24" fill="#fff" stroke="#d9bba5" stroke-width="3"/><circle cx="1027" cy="277" r="29" fill="#f6e7dd"/><text x="1027" y="286" fill="#8a583f" font-size="23" font-weight="700">4</text><text x="1027" y="340" fill="#173b3b" font-size="23" font-weight="700">状态更新</text><text x="1027" y="375" fill="#765e50" font-size="17">确认结果与资产变化</text></g>
  </g>
  <g fill="none" stroke="#2c9187" stroke-width="5" stroke-linecap="round"><path d="M320 320h30"/><path d="M605 320h30"/><path d="M890 320h30"/></g>
  <rect x="70" y="460" width="1060" height="76" rx="18" fill="#f7e9e5"/><text x="600" y="507" text-anchor="middle" fill="#8c463a" font-family="Arial,sans-serif" font-size="20" font-weight="700">池子流动性不足或代币合约异常时，报价和实际结果都可能不理想</text>
</svg>
