<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">加密社群安全核对流程</title><desc id="desc">独立核对账号、域名和公告，读懂钱包请求，并保护秘密信息。</desc>
  <rect width="1200" height="630" rx="36" fill="#f5f2e9"/><text x="72" y="92" fill="#315348" font-family="sans-serif" font-size="22" letter-spacing="4">COMMUNITY SAFETY · VERIFY BEFORE ACTION</text><text x="72" y="158" fill="#203d34" font-family="sans-serif" font-size="46" font-weight="700">群里的头衔与头像都能被仿冒</text>
  <g font-family="sans-serif" text-anchor="middle"><circle cx="218" cy="318" r="95" fill="#e1ebe3"/><text x="218" y="302" fill="#315348" font-size="20">第一步</text><text x="218" y="342" fill="#263d35" font-size="24" font-weight="700">核实账号</text><text x="218" y="374" fill="#65746d" font-size="16">查完整标识与渠道</text>
  <circle cx="474" cy="318" r="95" fill="#e1ebe3"/><text x="474" y="302" fill="#315348" font-size="20">第二步</text><text x="474" y="342" fill="#263d35" font-size="24" font-weight="700">核对域名</text><text x="474" y="374" fill="#65746d" font-size="16">自己打开官方入口</text>
  <circle cx="730" cy="318" r="95" fill="#eee7d7"/><text x="730" y="302" fill="#846a27" font-size="20">第三步</text><text x="730" y="342" fill="#403e35" font-size="24" font-weight="700">读懂签名</text><text x="730" y="374" fill="#746c58" font-size="16">确认权限与操作内容</text>
  <circle cx="986" cy="318" r="95" fill="#eee7d7"/><text x="986" y="302" fill="#846a27" font-size="20">第四步</text><text x="986" y="342" fill="#403e35" font-size="24" font-weight="700">保护秘密</text><text x="986" y="374" fill="#746c58" font-size="16">不交助记词或验证码</text></g>
  <g stroke="#82948b" stroke-width="4"><path d="M313 318h60"/><path d="M569 318h60"/><path d="M825 318h60"/></g><g fill="#82948b"><path d="m361 310 12 8-12 8z"/><path d="m617 310 12 8-12 8z"/><path d="m873 310 12 8-12 8z"/></g>
  <text x="72" y="510" fill="#43584f" font-family="sans-serif" font-size="21">陌生私信、限时空投和“付费解冻”要求，先独立查证再行动。</text><text x="72" y="566" fill="#839087" font-family="sans-serif" font-size="16">知页 · 一般安全教育</text>
</svg>
